<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Опора — память вашей игры</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="context.js"></script>
  <script defer src="brand-review.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <aside class="sidebar">
    <button class="logo" data-tab="overview" aria-label="Открыть рабочий стол"><span class="studio-name">Isidacorp</span><span class="product-name">ОПОРА <span class="version">/ 0.5</span></span></button>
    <div class="sidebar-label">ПРОЕКТ</div>
    <button class="project-switch" data-action="open"><span class="project-icon">[ ]</span><span><strong id="side-name">Тихая орбита</strong><small id="side-mode">Демо</small></span><span class="switch-arrow">/</span></button>
    <nav aria-label="Разделы проекта">
      <button data-tab="overview" class="nav-item active" title="Ctrl+1"><span class="nav-code">01</span>Рабочий стол</button>
      <button data-tab="tasks" class="nav-item" title="Ctrl+2"><span class="nav-code">02</span>Задачи<span id="task-count" class="count">3</span></button>
      <button data-tab="brand" class="nav-item" title="Ctrl+3"><span class="nav-code">03</span>Брендбук</button>
      <button data-tab="agents" class="nav-item" title="Ctrl+4"><span class="nav-code">04</span>Агенты</button>
      <button data-tab="context" class="nav-item" title="Ctrl+5"><span class="nav-code">05</span>Контекст</button>
    </nav>
    <div class="sidebar-bottom"><button class="text-button" data-action="help">[?] Справка <span>F1</span></button><span id="footer-status">GODOT / DEMO</span></div>
  </aside>
  <div class="workspace">
    <header class="topbar"><div class="breadcrumb"><span>/</span> <strong id="header-name">Тихая орбита</strong></div><div class="top-actions"><span id="save-status" class="save-status" role="status">Демо</span><button class="text-button" data-action="updates">Обновления</button><button class="button small secondary" data-action="open">Открыть проект</button></div></header>
    <main id="main"></main>
  </div>
  <dialog id="modal" aria-labelledby="modal-title"><div id="modal-content"></div></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
