<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Опора — память вашей игры</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="vendor/xterm.css">
  <script defer src="vendor/xterm.js"></script>
  <script defer src="vendor/addon-fit.js"></script>
  <script defer src="claude-terminal.js"></script>
  <script defer src="context.js"></script>
  <script defer src="brand-review.js"></script>
  <script defer src="project-map.js"></script>
  <script defer src="visual-feedback.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <div class="launch-intro" aria-hidden="true"><div class="launch-mark"><span class="launch-prompt">&gt;_</span><strong>ОПОРА</strong><span class="launch-cursor"></span><i class="launch-line"></i></div></div>
  <aside class="sidebar">
    <button class="logo" data-tab="overview" aria-label="Открыть рабочий стол"><span class="studio-name">Isidacorp</span><span class="product-name">ОПОРА <span class="version">/ 0.15.2</span></span></button>
    <div class="sidebar-label">ПРОЕКТ / GODOT</div>
    <button class="project-switch" data-action="open"><span class="project-icon">[ ]</span><span><strong id="side-name">Тихая орбита</strong><small id="side-mode">Демо</small></span><span class="switch-arrow">/</span></button>
    <nav aria-label="Разделы проекта">
      <button data-tab="overview" class="nav-item active" title="Ctrl+1"><span class="nav-code" aria-hidden="true">[1]</span>Рабочий стол</button>
      <button data-tab="tasks" class="nav-item" title="Ctrl+2"><span class="nav-code" aria-hidden="true">[2]</span>Задачи<span id="task-count" class="count">3</span></button>
      <button data-tab="brand" class="nav-item" title="Ctrl+3"><span class="nav-code" aria-hidden="true">[3]</span>Брендбук</button>
      <button data-tab="agents" class="nav-item" title="Ctrl+4"><span class="nav-code" aria-hidden="true">[4]</span>Агенты</button>
      <button data-tab="context" class="nav-item" title="Ctrl+5"><span class="nav-code" aria-hidden="true">[5]</span>Контекст</button>
      <button data-tab="map" class="nav-item" title="Ctrl+6"><span class="nav-code" aria-hidden="true">[6]</span>Карта проекта</button>
      <button data-tab="feedback" class="nav-item" title="Ctrl+7"><span class="nav-code" aria-hidden="true">[7]</span>Замечания</button>
    </nav>
    <section class="sidebar-task"><div class="sidebar-label">ТЕКУЩАЯ ЗАДАЧА</div><p id="side-active-task">Нет выбранной задачи</p><button class="text-button" data-action="goto-context">Контекст →</button></section>
    <div class="sidebar-bottom"><button class="text-button" data-action="help">[?] Справка <span>F1</span></button></div>
  </aside>
  <div class="workspace">
    <header class="topbar"><div class="breadcrumb"><span class="terminal-host" aria-hidden="true">opora@local</span><span aria-hidden="true">:</span><strong id="header-name">Тихая орбита</strong><span id="header-route" class="terminal-route">/desk</span><span class="terminal-caret" aria-hidden="true"></span></div><div class="top-actions"><button class="text-button" data-action="claude-open">&gt;_ Claude</button><button class="text-button command-trigger" data-action="commands" title="Ctrl+K"><span aria-hidden="true">&gt;_</span> Команды <kbd>Ctrl K</kbd></button><button class="text-button" data-action="updates">Обновления</button><button class="button small secondary" data-action="open">Открыть проект</button></div></header>
    <div id="brand-conflict" class="context-note conflict-bar" hidden><span>Данные изменены параллельно. Ваши правки остались в этом окне.</span><button class="text-button" data-action="brand-conflict">Сравнить версии →</button></div>
    <main id="main"></main>
    <section id="claude-dock" class="claude-dock" aria-label="Терминал Claude Code" hidden>
      <div class="claude-toolbar"><strong>&gt;_ Claude Code</strong><span data-terminal="status" role="status">НЕ ЗАПУЩЕН</span><button class="text-button" data-terminal="expand">Развернуть</button><button class="text-button" data-terminal="hide" aria-label="Скрыть терминал">Скрыть ×</button></div>
      <div class="claude-project" data-terminal="root"></div>
      <div class="claude-actions"><button class="button small" data-terminal="start">Новая сессия</button><button class="button small secondary" data-terminal="resume">Продолжить последнюю</button><button class="button small secondary" data-terminal="prompt" disabled>Вставить задачу</button><button class="text-button" data-terminal="select">Указать Claude</button><button class="text-button claude-stop" data-terminal="stop" disabled>Завершить</button><span class="small">Ctrl+Shift+C / V</span></div>
      <p class="claude-error" data-terminal="error" role="alert"></p>
      <div class="claude-screen" data-terminal="screen"></div>
    </section>
  </div>
  <footer class="terminal-statusbar"><span class="terminal-session">ОПОРА / 0.15.2</span><span id="footer-status">[DEMO]</span><span id="terminal-brand">СТИЛЬ: ЧЕРНОВИК</span><span class="terminal-keys">^1…7 разделы <span aria-hidden="true">|</span> ^N задача <span aria-hidden="true">|</span> ^K команды</span><span id="save-status" class="save-status" role="status">Демо</span></footer>
  <dialog id="modal" aria-labelledby="modal-title"><div id="modal-content"></div></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
