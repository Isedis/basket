<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Опора — память вашей игры</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="context.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <aside class="sidebar">
    <a class="logo" href="#overview" aria-label="Опора, главная"><span class="logo-mark">о<span>·</span></span>опора<span class="version">0.3</span></a>
    <div class="sidebar-label">РАБОЧЕЕ ПРОСТРАНСТВО</div>
    <button class="project-switch" data-action="open"><span class="project-icon">◈</span><span><strong id="side-name">Тихая орбита</strong><small id="side-mode">Демонстрационный проект</small></span><span class="switch-arrow">→</span></button>
    <nav aria-label="Разделы проекта">
      <button data-tab="overview" class="nav-item active"><span>◫</span>Обзор<span class="nav-short">01</span></button>
      <button data-tab="brand" class="nav-item"><span>◐</span>Визуальный стиль<span class="nav-short">02</span></button>
      <button data-tab="tasks" class="nav-item"><span>☷</span>Задачи<span id="task-count" class="count">3</span></button>
      <button data-tab="context" class="nav-item"><span>⌘</span>Контекст для ИИ<span class="nav-short">04</span></button>
      <button data-tab="agents" class="nav-item"><span>⇄</span>Агенты · MCP<span class="nav-short">05</span></button>
    </nav>
    <div class="sidebar-bottom"><div class="agent-dots"><span>C</span><span>→</span></div><strong>Один замысел.<br>Для обоих помощников.</strong><p>Общие решения для Claude и Codex, рядом с вашей игрой.</p><button class="text-button" data-action="help">Как это работает →</button></div>
    <div class="offline"><span class="status-dot"></span>Локально · без API и подписок</div>
  </aside>
  <div class="workspace">
    <header class="topbar"><div class="breadcrumb">МОИ ИГРЫ <span>/</span> <strong id="header-name">Тихая орбита</strong></div><div class="top-actions"><span id="save-status" class="save-status" role="status">Демо · изменения в браузере</span><button class="text-button" data-action="updates">Обновления</button><button class="button small secondary" data-action="open">Подключить проект <span>→</span></button></div></header>
    <main id="main"></main>
    <footer><span>Меньше повторений. Больше игры.</span><span id="footer-status">GODOT WORKSPACE / DEMO</span></footer>
  </div>
  <dialog id="modal" aria-labelledby="modal-title"><div id="modal-content"></div></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
