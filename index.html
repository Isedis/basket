<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0d0b14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Бесконечная Драка</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0b14; --panel:#16131f; --line:#2b2540; --text:#e9e4ff; --dim:#8a83a6;
  --hp:#e8384f; --hpbg:#3a1520; --zone:#f2c94c; --good:#5cff8a; --bad:#ff4f6d;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);overflow:hidden;
  font-family:"Press Start 2P",ui-monospace,monospace;font-size:9px;line-height:1.5;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#app{height:100dvh;height:100vh;max-width:520px;margin:0 auto;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);background:var(--bg)}
@supports (height:100dvh){#app{height:100dvh}}
#hud{padding:6px 8px 5px;background:var(--panel);border-bottom:2px solid var(--line);flex:none}
.r{display:flex;justify-content:space-between;align-items:center;gap:6px;white-space:nowrap}
.r+.r,.bar+.r,.r+.bar{margin-top:4px}
#zname{color:var(--zone);overflow:hidden;text-overflow:ellipsis}
#rank{color:#bdf;overflow:hidden;text-overflow:ellipsis}
.bar{position:relative;height:10px;background:#221d33;border:1px solid #000;image-rendering:pixelated}
.bar>i{position:absolute;left:0;top:0;bottom:0;background:var(--zone);width:0}
.bar>b{position:absolute;inset:0;text-align:center;font-weight:normal;font-size:7px;line-height:10px;color:#fff;text-shadow:1px 1px 0 #000}
#hpbar{background:var(--hpbg)} #hpbar>i{background:var(--hp)}
#zbar>i{background:#7a5cff}
#zbar{cursor:pointer}
.btn{font:inherit;font-size:8px;color:var(--text);background:#2b2540;border:2px solid #000;padding:3px 6px;cursor:pointer}
.btn:active{transform:translateY(1px)}
#ex{color:var(--bad);display:none}
#game{position:relative;flex:1 1 auto;min-height:150px;overflow:hidden;background:#000;touch-action:none}
#game canvas{position:absolute;left:0;top:0;image-rendering:pixelated;image-rendering:crisp-edges}
#toast{position:absolute;left:0;right:0;top:44px;text-align:center;pointer-events:none;z-index:3}
.tst{display:inline-block;margin:0 auto;padding:5px 9px;background:rgba(10,8,18,.9);border:2px solid #f2c94c;
  color:#fff;font-size:9px;animation:pop var(--dur,2.4s) steps(12) forwards;max-width:94%;white-space:normal;line-height:1.6}
.tst.tip{border-color:#4fd6e8;color:#bff4ff}
.tst.tip small{color:#e9e4ff}
.tst small{display:block;font-size:7px;color:var(--dim);margin-top:4px}
@keyframes pop{0%{transform:translateY(-8px);opacity:0}6%{transform:none;opacity:1}85%{opacity:1}100%{opacity:0}}
#panel{flex:0 0 38%;display:flex;flex-direction:column;background:var(--panel);border-top:2px solid var(--line);min-height:0;transition:flex-basis .2s}
#panel.small{flex-basis:92px}
#phead{padding:6px 8px 4px;flex:none}
#sum{display:grid;grid-template-columns:repeat(4,1fr);gap:2px 6px;padding:0 8px 5px;font-size:7px;color:var(--dim);flex:none}
#sum span b{color:var(--text);font-weight:normal}
#slist,#ylist,#dlist{overflow-y:auto;flex:1;min-height:0;padding:0 4px 8px;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.row{display:grid;grid-template-columns:8px 1fr auto auto;gap:6px;align-items:center;padding:3px 4px;border-bottom:1px solid #201b30;font-size:8px}
.row i{width:8px;height:8px;display:block;border:1px solid #000}
.row .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .w{color:#a58bff;font-size:7px}
.row .val{text-align:right;min-width:52px}
.row.fl{background:#2c2346}
.row.fl .val{color:var(--good)}
.row.new{animation:nw 1.2s steps(6)}
@keyframes nw{0%,50%{background:#f2c94c;color:#000}100%{background:transparent}}
[hidden]{display:none!important}
.tab{font:inherit;font-size:8px;color:var(--dim);background:none;border:0;padding:2px 0;cursor:pointer}
.tab.on{color:var(--text);text-decoration:underline;text-underline-offset:3px}
.tab b{color:var(--zone);font-weight:normal}
.syn{padding:5px 4px;border-bottom:1px solid #201b30;font-size:8px}
.syn .sd{font-size:7px;color:var(--dim);margin-top:3px;white-space:normal;line-height:1.6}
.syn.lk{opacity:.55}
.grp{border-bottom:1px solid #201b30}
.gh{display:grid;grid-template-columns:8px 8px 1fr auto auto;gap:6px;align-items:center;padding:6px 4px;font-size:8px;cursor:pointer;background:#1b1727}
.gh i{width:8px;height:8px;display:block;border:1px solid #000}
.gh .ga{color:var(--dim)}
.gh .gn{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gh .gn b{font-weight:normal}
.gh .gn em{font-style:normal;color:var(--dim);font-size:7px}
.gh .gn u{text-decoration:none;color:#5cff8a;font-size:7px}
.gh .gn s{text-decoration:none;color:#f2c94c}
.gh .gc{color:var(--dim);font-size:7px}
.gh .gv{text-align:right;min-width:48px}
.grp.fl .gh{background:#2c2346}
.grp.fl .gv{color:var(--good)}
.gb .row{padding-left:18px}
#info{margin:0 8px 6px;padding:7px 8px;border:2px solid #f2c94c;background:#1f1a2e;font-size:7px;line-height:1.8;flex:none;cursor:pointer;max-height:40%;overflow-y:auto}
#info h3{font-size:9px;font-weight:normal;margin-bottom:3px}
#info .k{color:var(--dim)}
#dlist{padding:8px 10px 14px;font-size:8px;line-height:1.9}
#dlist .big{display:block;width:100%;margin-top:8px;padding:9px;font-size:9px}
#dlist .dim{color:var(--dim);font-size:7px;margin-top:8px}
#rbtn{background:#7a2a8a}
#rbtn[disabled]{opacity:.45}
#tbtn{background:#2f5a8a}
#tree{position:fixed;inset:0;z-index:8;background:var(--bg);display:flex;flex-direction:column;
  padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
#thead{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;background:var(--panel);border-bottom:2px solid var(--line);font-size:9px}
#thead b{color:#ff44ff;font-weight:normal}
#tview{position:relative;flex:1;min-height:0;touch-action:none;overflow:hidden;background:#0a0812}
#tview canvas{position:absolute;inset:0}
#tzoom{position:absolute;right:8px;bottom:8px;display:flex;flex-direction:column;gap:6px}
#tzoom .btn{font-size:12px;width:34px;height:34px}
#tinfo{flex:none;min-height:124px;padding:8px 10px 10px;background:var(--panel);border-top:2px solid var(--line);font-size:8px;line-height:1.8}
#tinfo h3{font-size:10px;font-weight:normal}
#tinfo .k{color:var(--dim)}
#tinfo .row2{display:flex;gap:8px;margin-top:6px}
#tinfo .row2 .btn{flex:1;padding:8px;font-size:9px;background:#7a2a8a}
#tinfo .row2 .btn[disabled]{opacity:.4}
@keyframes glow{0%,100%{color:#ff44ff}50%{color:#ffffff}}
.tab.glow{animation:glow 1s steps(2) infinite}
#modal{position:fixed;inset:0;background:rgba(5,4,10,.86);display:flex;align-items:center;justify-content:center;z-index:9;padding:16px}
#modal[hidden]{display:none}
#mbox{background:var(--panel);border:3px solid #f2c94c;padding:14px;max-width:340px;width:100%;text-align:center;line-height:1.9}
#mbox h2{font-size:11px;color:var(--zone);margin-bottom:8px;font-weight:normal}
#mbox p{font-size:8px}
#mbox .btn{margin-top:12px;font-size:10px;padding:8px 14px;background:#7a5cff}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="r"><span id="zname">Луг</span><span><span id="znum">Зона 1</span> <button class="btn" id="treeb" style="background:#5a2a6a;font-size:13px;padding:0 7px;line-height:20px">★</button> <button class="btn" id="fxb">ЭФФ</button> <button class="btn" id="mute">♪ ВКЛ</button></span></div>
    <div class="bar" id="zbar"><i></i><b></b></div>
    <div class="r"><span id="rank">Новобранец</span><span id="ex">ИЗНЕМОЖЕНИЕ</span><span id="kills">0 убийств</span></div>
    <div class="bar" id="hpbar"><i></i><i style="background:#9fe8ff;opacity:.75"></i><b></b></div>
  </div>
  <div id="game"><canvas id="cv"></canvas><canvas id="fx"></canvas><div id="toast"></div></div>
  <div id="panel">
    <div id="phead">
      <div class="r"><span><button class="tab on" id="tabS">СТАТЫ <b id="scount">3</b></button> &nbsp; <button class="tab" id="tabY">СИНЕРГИИ <b id="ycount">0</b></button> &nbsp; <button class="tab" id="tabD">ДУШИ <b id="dcount">0</b></button></span><button class="btn" id="ptog">▼</button></div>
      <div class="bar" id="ubar" style="margin-top:4px"><i style="background:#2f8a4f"></i><b id="snext"></b></div>
    </div>
    <div id="sum"></div>
    <div id="info" hidden></div>
    <div id="slist"></div>
    <div id="ylist" hidden></div>
    <div id="dlist" hidden>
      <div class="r"><span>Души: <b id="dsouls" style="color:#ff44ff;font-weight:normal">0</b></span><span>Перерождений: <b id="dreb" style="font-weight:normal">0</b></span></div>
      <div>Рекорд зоны: <span id="dbest">1</span></div>
      <div id="dfore"></div>
      <button class="btn big" id="rbtn">ПЕРЕРОДИТЬСЯ</button>
      <button class="btn big" id="tbtn">ДЕРЕВО ТАЛАНТОВ</button>
      <div class="dim">Перерождение сбрасывает зону и статы. Души остаются навсегда — трать их в дереве талантов на вечные бонусы. Чем дальше зашёл, тем больше душ.</div>
    </div>
  </div>
</div>
<div id="tree" hidden>
  <div id="thead"><span>ДЕРЕВО ТАЛАНТОВ</span><span>Души: <b id="tsouls">0</b></span><button class="btn" id="tclose">✕ ЗАКРЫТЬ</button></div>
  <div id="tview"><canvas id="tcv"></canvas><div id="tzoom"><button class="btn" id="tzi">+</button><button class="btn" id="tzo">−</button></div></div>
  <div id="tinfo"></div>
</div>
<div id="modal" hidden><div id="mbox"><h2 id="mt"></h2><p id="mp"></p><button class="btn" id="mok">В БОЙ!</button></div></div>

<script>
'use strict';
/* =========================================================
   БЕСКОНЕЧНАЯ ДРАКА — пиксельная бесконечная прокачка
   ========================================================= */
const $ = id => document.getElementById(id);
const rnd = Math.random;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const sat = (x, k) => x / (x + k);           // плавное насыщение 0..1, никогда не достигает 1
const lg = x => Math.log10(1 + Math.max(0, x));

/* ---------- форматирование чисел ---------- */
const SUF = ['', 'K', 'M', 'B', 'T', 'Qa', 'Qi', 'Sx', 'Sp', 'Oc', 'No', 'Dc', 'Ud', 'Dd', 'Td', 'Qad', 'Qid', 'Sxd', 'Spd', 'Ocd', 'Nod', 'Vg'];
function fmt(n) {
  if (!isFinite(n)) return '∞';
  if (n < 0) return '-' + fmt(-n);
  if (n < 10) return (Math.round(n * 10) / 10).toString();
  if (n < 1000) return Math.floor(n).toString();
  const ex = Math.floor(Math.log10(n));
  const e3 = Math.floor(ex / 3);
  if (e3 < SUF.length) {
    const m = n / Math.pow(10, e3 * 3);
    return (m < 10 ? m.toFixed(2) : m < 100 ? m.toFixed(1) : Math.floor(m)) + SUF[e3];
  }
  return (n / Math.pow(10, ex)).toFixed(2) + 'e' + ex;
}
const pct = x => (x * 100 < 10 ? (x * 100).toFixed(1) : Math.floor(x * 100)) + '%';
function roman(n) {
  const m = [[1000,'M'],[900,'CM'],[500,'D'],[400,'CD'],[100,'C'],[90,'XC'],[50,'L'],[40,'XL'],[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']];
  let s = ''; for (const [v, r] of m) while (n >= v) { s += r; n -= v; } return s;
}

/* ---------- цвета ---------- */
function hexRgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function rgbHex(r, g, b) { return '#' + ((1 << 24) | (clamp(r|0,0,255) << 16) | (clamp(g|0,0,255) << 8) | clamp(b|0,0,255)).toString(16).slice(1); }
function shade(h, f) { const [r, g, b] = hexRgb(h); return f < 0 ? rgbHex(r * (1 + f), g * (1 + f), b * (1 + f)) : rgbHex(r + (255 - r) * f, g + (255 - g) * f, b + (255 - b) * f); }
function hsl2hex(h, s, l) {
  h = ((h % 360) + 360) % 360; s /= 100; l /= 100;
  const k = n => (n + h / 30) % 12, a = s * Math.min(l, 1 - l);
  const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
  return rgbHex(f(0) * 255, f(8) * 255, f(4) * 255);
}
function hueShift(hex, dh) {
  let [r, g, b] = hexRgb(hex).map(v => v / 255);
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b); let h = 0, s = 0; const l = (mx + mn) / 2;
  if (mx !== mn) { const d = mx - mn; s = l > .5 ? d / (2 - mx - mn) : d / (mx + mn);
    h = mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4; h *= 60; }
  return hsl2hex(h + dh, s * 100, l * 100);
}

/* ---------- эффекты (основы статов) ---------- */
const EFF = [
  { k: 'dmg',   n: 'Сила',        c: '#ff5544', d: 'урон удара' },
  { k: 'hp',    n: 'Живучесть',   c: '#ff88aa', d: 'макс. здоровье' },
  { k: 'aspd',  n: 'Ловкость',    c: '#ffdd44', d: 'скорость атаки' },
  { k: 'crit',  n: 'Точность',    c: '#ffaa22', d: 'шанс крита' },
  { k: 'regen', n: 'Регенерация', c: '#44ee66', d: 'восстановление HP' },
  { k: 'armor', n: 'Броня',       c: '#aabbcc', d: 'снижение урона' },
  { k: 'critd', n: 'Жестокость',  c: '#ff7a00', d: 'сила крита' },
  { k: 'vamp',  n: 'Вампиризм',   c: '#cc2244', d: 'лечение ударом' },
  { k: 'luck',  n: 'Удача',       c: '#44ffaa', d: 'редкие враги, награды' },
  { k: 'wis',   n: 'Мудрость',    c: '#bb88ff', d: 'прирост статов' },
  { k: 'move',  n: 'Скорость',    c: '#66ccff', d: 'скорость бега' },
  { k: 'cleave',n: 'Рассечение',  c: '#ff9988', d: 'доп. цели удара' },
  { k: 'dodge', n: 'Уклонение',   c: '#88ddff', d: 'шанс уворота' },
  { k: 'range', n: 'Размах',      c: '#dddd88', d: 'дальность удара' },
  { k: 'fire',  n: 'Пламя',       c: '#ff6622', d: 'огненный взрыв' },
  { k: 'poison',n: 'Яд',          c: '#88ee22', d: 'урон ядом' },
  { k: 'shock', n: 'Молния',      c: '#99eeff', d: 'цепная молния' },
  { k: 'thorns',n: 'Шипы',        c: '#cc9966', d: 'отражение урона' },
  { k: 'power', n: 'Мощь',        c: '#ff44ff', d: 'множитель урона' },
  { k: 'fury',  n: 'Ярость',      c: '#ff2222', d: 'урон при низком HP' },
];
const NE = EFF.length;
const EI = {}; EFF.forEach((e, i) => EI[e.k] = i);
// формы эффектов: на порогах эффект меняет вид и получает новую механику
const EFORM = [
  ['Тяжёлый удар', 'Сокрушение', 'Раскол земли', 'Удар титана'],
  ['Крепкое тело', 'Каменная плоть', 'Живая гора', 'Бессмертное тело'],
  ['Быстрые руки', 'Шквал', 'Буря клинков', 'Тысяча ударов'],
  ['Меткий глаз', 'Слабые места', 'Звёздный крит', 'Абсолютный крит'],
  ['Заживление', 'Живой щит', 'Источник', 'Феникс'],
  ['Кожа', 'Кольчуга', 'Латы', 'Адамант'],
  ['Жестокость', 'Разрыв', 'Казнь', 'Аннигиляция'],
  ['Кровопийца', 'Жажда', 'Кровавая река', 'Владыка крови'],
  ['Везунчик', 'Клевер', 'Джекпот', 'Любимец судьбы'],
  ['Ученик', 'Двойной урок', 'Архимаг', 'Всезнание'],
  ['Резвость', 'Рывок', 'Послеобразы', 'Вездесущий'],
  ['Широкий замах', 'Двойной разрез', 'Вихрь', 'Ураган стали'],
  ['Ловкач', 'Тень', 'Призрак', 'Неуловимый'],
  ['Длинный меч', 'Алебарда', 'Копьё света', 'Бесконечный клинок'],
  ['Искры', 'Взрыв', 'Огненное кольцо', 'Метеоры'],
  ['Отрава', 'Ядовитое облако', 'Мор', 'Чёрная смерть'],
  ['Искра', 'Разряд', 'Шаровая молния', 'Небесный гром'],
  ['Колючки', 'Шипастая броня', 'Терновая волна', 'Терновый венец'],
  ['Сила воли', 'Мощь', 'Сияние', 'Божественная мощь'],
  ['Злость', 'Гнев', 'Багровая аура', 'Бешенство'],
];
const FORM_HINT = {
  dmg: 'со 2-й формы удар даёт волну, с 3-й волна ранит соседей',
  regen: 'со 2-й формы лишнее лечение копится в щит',
  crit: 'с 3-й формы криты взрываются звездой',
  critd: 'криты оставляют огненный разрез',
  vamp: 'капли крови летят из врагов к герою',
  luck: 'с 3-й формы бывает ДЖЕКПОТ: все враги золотые',
  wis: 'со 2-й формы бывает двойной прирост',
  move: 'с 3-й формы послеобразы бьют других врагов',
  cleave: 'с 3-й формы каждый 4-й удар — вихрь по всем вокруг',
  fire: 'с 3-й формы огненное кольцо, с 4-й метеоры',
  poison: 'со 2-й формы яд оставляет облака',
  shock: 'с 3-й формы шаровые молнии, с 4-й удары с неба',
  thorns: 'с 3-й формы терновая волна вокруг героя',
};
const formNeed = f => 3 * Math.pow(10, 1.5 * (f - 1));
const formName = (e, f) => f <= 0 ? 'нет формы' : EFORM[e][Math.min(f, 4) - 1] + (f > 4 ? ' ' + roman(f - 3) : '');
const SPEC = ['Громила', 'Колосс', 'Дуэлянт', 'Снайпер', 'Целитель', 'Страж', 'Палач', 'Вампир', 'Счастливчик', 'Мудрец',
  'Ветер', 'Мясник', 'Тень', 'Копейщик', 'Пиромант', 'Чумной доктор', 'Громовержец', 'Ёж', 'Титан', 'Берсерк'];
let formNew = [];
const F = i => (S.form && S.form[i]) || 0;
function updForms(R) {
  if (!S.form) S.form = [];
  EFF.forEach((e, i) => {
    const r = R[e.k] * (1 + ta('form')), f = r < 3 ? 0 : 1 + Math.floor(Math.log10(r / 3) / 1.5);
    if (f > (S.form[i] || 0)) { S.form[i] = f; formNew.push([i, f]); }   // форма никогда не откатывается
  });

const NOUNS = ['Ярость','Кровь','Мощь','Длань','Душа','Печать','Сталь','Искра','Тень','Песнь','Клятва','Гнев','Дух','Пламя','Коготь','Клык','Сердце','Взор','Шёпот','Рёв','Воля','Руна','Слеза','Кость','Корона','Буря','Метка','Жажда'];

function drawHero(rk) {

const tPtr = new Map(); let tMoved = 0, tPinch = 0;

/* ---------- сохранение и офлайн-прогресс ---------- */
function save() {
  S.vals = stats.map(s => s.v); S.lv = stats.map(s => s.lvl); S.t = Date.now(); S.hpf = hero.hp / D.maxHP;
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {}
}
function load() {
  try { const d = JSON.parse(localStorage.getItem(SAVE_KEY)); if (d && d.vals) S = Object.assign(S, d); } catch (e) {}
}
function offline(sec) {
  if (sec < 20) return;
  const kills = Math.floor(sec * Math.max(.1, S.kps) * (.5 + .5 * sat(ta('offline'), 1)));
  if (kills < 1) return;
  const z0 = S.zone, s0 = stats.length, k0 = S.kills;
  let left = kills, it = 0, evos = 0;
  mobs = []; bossAlive = false;
  while (left > 0 && it < 200000) {
    if (it++ % 10 === 0) recalc();
    let k;
    if (S.zk >= zoneNeed()) {
      recalc();
      if (readiness() >= 1) { S.zone++; S.zk = 0; continue; }
      k = Math.min(left, 150);          // стена: герой фармит, пока не станет готов
    } else k = Math.max(1, Math.min(left, zoneNeed() - S.zk));
    const g = k * zs() * D.gainMult * 3.5 * (1 + D.rare * 7) * 1.3 * (1 + ta('gain')) * (S.zone < S.meta.best * .5 ? 1 + ta('legacy') : 1);
    const picks = Math.min(stats.length, 12);
    for (let p = 0; p < picks; p++) { const s = pickStat(); s.v += g / picks * (.6 + rnd() * .8); evos += tryEvolve(s, true); }
    S.kills += k; S.zk = Math.min(zoneNeed(), S.zk + k); left -= k;
    checkUnlocks(true);
  }
  recalc(); buildGround();
  const nsyn = synNew.length; synNew = [];
  const nform = formNew.length; formNew = [];
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60);
  $('mt').textContent = 'ПОКА ТЕБЯ НЕ БЫЛО';
  $('mp').innerHTML = `Прошло: ${h ? h + 'ч ' : ''}${m}м<br>Герой дрался дальше:<br><br>+${fmt(S.kills - k0)} убийств<br>` +
    `Зона ${z0} → <span style="color:#f2c94c">${S.zone}</span><br>Новых статов: <span style="color:#5cff8a">${stats.length - s0}</span><br>Эволюций: <span style="color:#bb88ff">${evos}</span>${nform ? '<br>Новых форм: <span style="color:#ffdd44">' + nform + '</span>' : ''}${nsyn ? '<br>Синергий: <span style="color:#ff44ff">+' + nsyn + '</span>' : ''}`;
  $('modal').hidden = false;
}

if (!S.meta) S.meta = freshS().meta;
calcTal();
for (let i = 0; i < 3; i++) { const s = makeStat(i); if (S.vals[i] !== undefined) s.v = S.vals[i]; if (S.lv && S.lv[i]) setLvl(s, S.lv[i]); stats.push(s); addStatRow(s, false); }
if (!S.vals.length) { stats[0].v = 2; stats[1].v = 3; stats[2].v = 1; }
checkUnlocks(true);
recalc();
hero.hp = D.maxHP * clamp(S.hpf || 1, .3, 1);
$('mute').textContent = S.mute ? '♪ ВЫКЛ' : '♪ ВКЛ'; applyFx();
$('panel').classList.toggle('small', !!S.panelSmall); $('ptog').textContent = S.panelSmall ? '▲' : '▼';
resize();
hero.x = W / 2; hero.y = H / 2;
const away = (Date.now() - (S.t || Date.now())) / 1000;
if (S.kills > 0 && away > 20) offline(away);
else if (S.kills === 0) { $('mt').textContent = 'БЕСКОНЕЧНАЯ ДРАКА'; $('mp').innerHTML = 'Герой дерётся сам.<br>Каждое убийство даёт статы.<br>Статы бесконечны.<br><br><span style="color:#fff8a0">Тапай по врагам</span> — бей молнией с неба!<br><br>Держи <span style="color:#ffdd44">комбо</span>, качай пары статов ради <span style="color:#ff44ff">синергий</span>.<br><br><span style="color:#8a83a6">Низкое HP = меньше наград.</span>'; $('modal').hidden = false; }
document.fonts && document.fonts.ready.then(() => updateUI());

let last = performance.now();
function frame(now) {
  const real = Math.min(.05, (now - last) / 1000); last = now;
  slowT -= real; flashT -= real;
  update(slowT > 0 ? real * .3 : real); render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
