<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0d0b14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Бесконечная Драка</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0b14; --panel:#16131f; --line:#2b2540; --text:#e9e4ff; --dim:#8a83a6;
  --hp:#e8384f; --hpbg:#3a1520; --zone:#f2c94c; --good:#5cff8a; --bad:#ff4f6d;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);overflow:hidden;
  font-family:"Press Start 2P",ui-monospace,monospace;font-size:9px;line-height:1.5;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#app{height:100dvh;height:100vh;max-width:520px;margin:0 auto;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);background:var(--bg)}
@supports (height:100dvh){#app{height:100dvh}}
#hud{padding:6px 8px 5px;background:var(--panel);border-bottom:2px solid var(--line);flex:none}
.r{display:flex;justify-content:space-between;align-items:center;gap:6px;white-space:nowrap}
.r+.r,.bar+.r,.r+.bar{margin-top:4px}
#zname{color:var(--zone);overflow:hidden;text-overflow:ellipsis}
#rank{color:#bdf;overflow:hidden;text-overflow:ellipsis}
.bar{position:relative;height:10px;background:#221d33;border:1px solid #000;image-rendering:pixelated}
.bar>i{position:absolute;left:0;top:0;bottom:0;background:var(--zone);width:0}
.bar>b{position:absolute;inset:0;text-align:center;font-weight:normal;font-size:7px;line-height:10px;color:#fff;text-shadow:1px 1px 0 #000}
#hpbar{background:var(--hpbg)} #hpbar>i{background:var(--hp)}
#zbar>i{background:#7a5cff}
.btn{font:inherit;font-size:8px;color:var(--text);background:#2b2540;border:2px solid #000;padding:3px 6px;cursor:pointer}
.btn:active{transform:translateY(1px)}
#ex{color:var(--bad);display:none}
#game{position:relative;flex:1 1 auto;min-height:150px;overflow:hidden;background:#000;touch-action:none}
#game canvas{position:absolute;left:0;top:0;image-rendering:pixelated;image-rendering:crisp-edges}
#toast{position:absolute;left:0;right:0;top:18%;text-align:center;pointer-events:none;z-index:3}
.tst{display:inline-block;margin:3px auto;padding:7px 10px;background:rgba(10,8,18,.88);border:2px solid #f2c94c;
  color:#fff;font-size:9px;animation:pop 2.6s steps(12) forwards;max-width:92%;white-space:normal}
.tst small{display:block;font-size:7px;color:var(--dim);margin-top:4px}
@keyframes pop{0%{transform:scale(.4);opacity:0}8%{transform:scale(1.15);opacity:1}14%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
#panel{flex:0 0 38%;display:flex;flex-direction:column;background:var(--panel);border-top:2px solid var(--line);min-height:0;transition:flex-basis .2s}
#panel.small{flex-basis:92px}
#phead{padding:6px 8px 4px;flex:none}
#sum{display:grid;grid-template-columns:repeat(4,1fr);gap:2px 6px;padding:0 8px 5px;font-size:7px;color:var(--dim);flex:none}
#sum span b{color:var(--text);font-weight:normal}
#slist,#ylist{overflow-y:auto;flex:1;min-height:0;padding:0 4px 8px;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.row{display:grid;grid-template-columns:8px 1fr auto auto;gap:6px;align-items:center;padding:3px 4px;border-bottom:1px solid #201b30;font-size:8px}
.row i{width:8px;height:8px;display:block;border:1px solid #000}
.row .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .w{color:#a58bff;font-size:7px}
.row .val{text-align:right;min-width:52px}
.row.fl{background:#2c2346}
.row.fl .val{color:var(--good)}
.row.new{animation:nw 1.2s steps(6)}
@keyframes nw{0%,50%{background:#f2c94c;color:#000}100%{background:transparent}}
[hidden]{display:none!important}
.tab{font:inherit;font-size:8px;color:var(--dim);background:none;border:0;padding:2px 0;cursor:pointer}
.tab.on{color:var(--text);text-decoration:underline;text-underline-offset:3px}
.tab b{color:var(--zone);font-weight:normal}
.syn{padding:5px 4px;border-bottom:1px solid #201b30;font-size:8px}
.syn .sd{font-size:7px;color:var(--dim);margin-top:3px;white-space:normal;line-height:1.6}
.syn.lk{opacity:.55}
#modal{position:fixed;inset:0;background:rgba(5,4,10,.86);display:flex;align-items:center;justify-content:center;z-index:9;padding:16px}
#modal[hidden]{display:none}
#mbox{background:var(--panel);border:3px solid #f2c94c;padding:14px;max-width:340px;width:100%;text-align:center;line-height:1.9}
#mbox h2{font-size:11px;color:var(--zone);margin-bottom:8px;font-weight:normal}
#mbox p{font-size:8px}
#mbox .btn{margin-top:12px;font-size:10px;padding:8px 14px;background:#7a5cff}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="r"><span id="zname">Луг</span><span><span id="znum">Зона 1</span> <button class="btn" id="mute">♪ ВКЛ</button></span></div>
    <div class="bar" id="zbar"><i></i><b></b></div>
    <div class="r"><span id="rank">Новобранец</span><span id="ex">ИЗНЕМОЖЕНИЕ</span><span id="kills">0 убийств</span></div>
    <div class="bar" id="hpbar"><i></i><b></b></div>
  </div>
  <div id="game"><canvas id="cv"></canvas><canvas id="fx"></canvas><div id="toast"></div></div>
  <div id="panel">
    <div id="phead">
      <div class="r"><span><button class="tab on" id="tabS">СТАТЫ <b id="scount">3</b></button> &nbsp; <button class="tab" id="tabY">СИНЕРГИИ <b id="ycount">0</b></button></span><button class="btn" id="ptog">▼</button></div>
      <div class="bar" id="ubar" style="margin-top:4px"><i style="background:#2f8a4f"></i><b id="snext"></b></div>
    </div>
    <div id="sum"></div>
    <div id="slist"></div>
    <div id="ylist" hidden></div>
  </div>
</div>
<div id="modal" hidden><div id="mbox"><h2 id="mt"></h2><p id="mp"></p><button class="btn" id="mok">В БОЙ!</button></div></div>

<script>
'use strict';
/* =========================================================
   БЕСКОНЕЧНАЯ ДРАКА — пиксельная бесконечная прокачка
   ========================================================= */
const $ = id => document.getElementById(id);
const rnd = Math.random;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const sat = (x, k) => x / (x + k);           // плавное насыщение 0..1, никогда не достигает 1
const lg = x => Math.log10(1 + Math.max(0, x));

/* ---------- форматирование чисел ---------- */
const SUF = ['', 'K', 'M', 'B', 'T', 'Qa', 'Qi', 'Sx', 'Sp', 'Oc', 'No', 'Dc', 'Ud', 'Dd', 'Td', 'Qad', 'Qid', 'Sxd', 'Spd', 'Ocd', 'Nod', 'Vg'];
function fmt(n) {
  if (!isFinite(n)) return '∞';
  if (n < 0) return '-' + fmt(-n);
  if (n < 10) return (Math.round(n * 10) / 10).toString();
  if (n < 1000) return Math.floor(n).toString();
  const ex = Math.floor(Math.log10(n));
  const e3 = Math.floor(ex / 3);
  if (e3 < SUF.length) {
    const m = n / Math.pow(10, e3 * 3);
    return (m < 10 ? m.toFixed(2) : m < 100 ? m.toFixed(1) : Math.floor(m)) + SUF[e3];
  }
  return (n / Math.pow(10, ex)).toFixed(2) + 'e' + ex;
}
const pct = x => (x * 100 < 10 ? (x * 100).toFixed(1) : Math.floor(x * 100)) + '%';
function roman(n) {
  const m = [[1000,'M'],[900,'CM'],[500,'D'],[400,'CD'],[100,'C'],[90,'XC'],[50,'L'],[40,'XL'],[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']];
  let s = ''; for (const [v, r] of m) while (n >= v) { s += r; n -= v; } return s;
}

/* ---------- цвета ---------- */
function hexRgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function rgbHex(r, g, b) { return '#' + ((1 << 24) | (clamp(r|0,0,255) << 16) | (clamp(g|0,0,255) << 8) | clamp(b|0,0,255)).toString(16).slice(1); }
function shade(h, f) { const [r, g, b] = hexRgb(h); return f < 0 ? rgbHex(r * (1 + f), g * (1 + f), b * (1 + f)) : rgbHex(r + (255 - r) * f, g + (255 - g) * f, b + (255 - b) * f); }
function hsl2hex(h, s, l) {
  h = ((h % 360) + 360) % 360; s /= 100; l /= 100;
  const k = n => (n + h / 30) % 12, a = s * Math.min(l, 1 - l);
  const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
  return rgbHex(f(0) * 255, f(8) * 255, f(4) * 255);
}
function hueShift(hex, dh) {
  let [r, g, b] = hexRgb(hex).map(v => v / 255);
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b); let h = 0, s = 0; const l = (mx + mn) / 2;
  if (mx !== mn) { const d = mx - mn; s = l > .5 ? d / (2 - mx - mn) : d / (mx + mn);
    h = mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4; h *= 60; }
  return hsl2hex(h + dh, s * 100, l * 100);
}

/* ---------- эффекты (основы статов) ---------- */
const EFF = [
  { k: 'dmg',   n: 'Сила',        c: '#ff5544', d: 'урон удара' },
  { k: 'hp',    n: 'Живучесть',   c: '#ff88aa', d: 'макс. здоровье' },
  { k: 'aspd',  n: 'Ловкость',    c: '#ffdd44', d: 'скорость атаки' },
  { k: 'crit',  n: 'Точность',    c: '#ffaa22', d: 'шанс крита' },
  { k: 'regen', n: 'Регенерация', c: '#44ee66', d: 'восстановление HP' },
  { k: 'armor', n: 'Броня',       c: '#aabbcc', d: 'снижение урона' },
  { k: 'critd', n: 'Жестокость',  c: '#ff7a00', d: 'сила крита' },
  { k: 'vamp',  n: 'Вампиризм',   c: '#cc2244', d: 'лечение ударом' },
  { k: 'luck',  n: 'Удача',       c: '#44ffaa', d: 'редкие враги, награды' },
  { k: 'wis',   n: 'Мудрость',    c: '#bb88ff', d: 'прирост статов' },
  { k: 'move',  n: 'Скорость',    c: '#66ccff', d: 'скорость бега' },
  { k: 'cleave',n: 'Рассечение',  c: '#ff9988', d: 'доп. цели удара' },
  { k: 'dodge', n: 'Уклонение',   c: '#88ddff', d: 'шанс уворота' },
  { k: 'range', n: 'Размах',      c: '#dddd88', d: 'дальность удара' },
  { k: 'fire',  n: 'Пламя',       c: '#ff6622', d: 'огненный взрыв' },
  { k: 'poison',n: 'Яд',          c: '#88ee22', d: 'урон ядом' },
  { k: 'shock', n: 'Молния',      c: '#99eeff', d: 'цепная молния' },
  { k: 'thorns',n: 'Шипы',        c: '#cc9966', d: 'отражение урона' },
  { k: 'power', n: 'Мощь',        c: '#ff44ff', d: 'множитель урона' },
  { k: 'fury',  n: 'Ярость',      c: '#ff2222', d: 'урон при низком HP' },
];
const NE = EFF.length;
const NOUNS = ['Ярость','Кровь','Мощь','Длань','Душа','Печать','Сталь','Искра','Тень','Песнь','Клятва','Гнев','Дух','Пламя','Коготь','Клык','Сердце','Взор','Шёпот','Рёв','Воля','Руна','Слеза','Кость','Корона','Буря','Метка','Жажда'];
const GENS  = ['Дракона','Бездны','Титана','Пепла','Луны','Солнца','Бури','Звёзд','Древних','Хаоса','Грома','Льда','Демона','Феникса','Вечности','Пустоты','Короля','Волка','Крови','Мёртвых','Небес','Вулкана','Ворона','Змея','Рассвета','Глубин','Богов','Войны'];
const NPAIR = NOUNS.length * GENS.length;

function hash(n) { n = (n ^ 61) ^ (n >>> 16); n = n + (n << 3); n = n ^ (n >>> 4); n = Math.imul(n, 0x27d4eb2d); return (n ^ (n >>> 15)) >>> 0; }
function makeStat(n) {
  let bn, e, w0;
  if (n < NE) { bn = EFF[n].n; e = n; w0 = 1; }
  else {
    const i = n - NE;
    const p = (i * 7919) % NPAIR, tier = Math.floor(i / NPAIR);
    bn = NOUNS[p % NOUNS.length] + ' ' + GENS[Math.floor(p / NOUNS.length)] + (tier ? ' (' + (tier + 1) + ')' : '');
    e = hash(i + 7) % NE; w0 = Math.pow(1.5, i / 10 + 1);
  }
  const s = { n, bn, e, w0, lvl: 0, v: 0, g: 0, at: 0 }; setLvl(s, 0); return s;
}
// эволюция: стат перерастает порог и превращается в более сильную версию (вес ×4)
function setLvl(s, l) { s.lvl = l; s.w = s.w0 * Math.pow(4, l); s.name = s.bn + (l ? ' ' + roman(l + 1) : ''); }
const evoAt = s => 1000 * Math.pow(1000, s.lvl);
let evoToastT = 0;
function tryEvolve(s, silent) {
  let up = 0; while (s.v >= evoAt(s)) { setLvl(s, s.lvl + 1); up++; }
  if (!up) return 0;
  D.dirty = true;
  if (s.el) { s.el.children[1].textContent = s.name; s.el.children[2].textContent = '×' + fmt(s.w); s.el.classList.remove('new'); void s.el.offsetWidth; s.el.classList.add('new'); }
  if (!silent) { ftext(hero.x, hero.y - 16, 'ЭВОЛЮЦИЯ: ' + s.name, EFF[s.e].c, .9, 1.4); }
  if (!silent && performance.now() > evoToastT) { evoToastT = performance.now() + 6000; toast('ЭВОЛЮЦИЯ!', s.bn + ' → ' + s.name + ' (вес ×' + fmt(s.w) + ')'); sfx.evo(); flashT = Math.max(flashT, .08); burst(hero.x, hero.y - 4, EFF[s.e].c, 24, 45); }
  return up;
}

/* ---------- синергии ---------- */
const SYN = [
  { n: 'Плазма',          a: 'fire',  b: 'shock',  d: 'взрывы бьют молниями' },
  { n: 'Чума',            a: 'poison',b: 'cleave', d: 'яд перекидывается на соседей' },
  { n: 'Кровавая жатва',  a: 'vamp',  b: 'crit',   d: 'криты лечат и бьют сильнее' },
  { n: 'Крепость',        a: 'armor', b: 'thorns', d: 'шипы сильнее и бьют вокруг' },
  { n: 'Ураган',          a: 'aspd',  b: 'move',   d: '+15% скорости атаки за уровень' },
  { n: 'Фортуна',         a: 'luck',  b: 'wis',    d: 'редкие враги чаще и щедрее' },
  { n: 'Берсерк',         a: 'fury',  b: 'power',  d: 'ярость намного сильнее' },
  { n: 'Бессмертие',      a: 'regen', b: 'hp',     d: '+50% регенерации за уровень' },
  { n: 'Танец теней',     a: 'dodge', b: 'move',   d: 'уворот даёт контрудар' },
  { n: 'Гроза',           a: 'shock', b: 'range',  d: 'цепь молний длиннее' },
  { n: 'Огненный шторм',  a: 'fire',  b: 'range',  d: 'радиус взрывов больше' },
  { n: 'Палач',           a: 'critd', b: 'dmg',    d: '+50% силы крита за уровень' },
].map(y => ({ ...y, a: EFF.findIndex(e => e.k === y.a), b: EFF.findIndex(e => e.k === y.b) }));
const SYN_TH = 50;
let synNew = [];
const sy = i => (S.syn && S.syn[i]) || 0;
function updSyn(R) {
  if (!S.syn) S.syn = [];
  SYN.forEach((y, i) => {
    const m = Math.min(R[EFF[y.a].k], R[EFF[y.b].k]);
    const l = m >= SYN_TH ? Math.floor(Math.log10(m / SYN_TH) / 2) + 1 : 0;
    const was = S.syn[i] || 0;
    if (l > was) { S.syn[i] = l; synNew.push([i, was]); }   // уровень синергии никогда не падает
  });
}

/* ---------- аффиксы мобов ---------- */
const AFF = [
  { n: 'Бронированный', c: '#aabbcc' }, { n: 'Быстрый', c: '#66ccff' }, { n: 'Взрывной', c: '#ff6622' }, { n: 'Вампир', c: '#cc2244' },
  { n: 'Делящийся', c: '#88ee22' }, { n: 'Гигант', c: '#ffdd44' }, { n: 'Регенерирующий', c: '#44ee66' }, { n: 'Призрачный', c: '#bb88ff' },
];
const popc = a => { let c = 0; while (a) { c += a & 1; a >>= 1; } return c; };
function rollAff(boss) {
  const max = Math.min(AFF.length, 1 + Math.floor(S.zone / 8));
  let n = 0;
  if (boss) n = S.zone < 6 ? 0 : Math.min(max, Math.floor(S.zone / 12) + 1);
  else { const p = Math.min(.85, .08 + S.zone * .012); while (n < max && rnd() < p) n++; }
  let af = 0, guard = 0;
  while (popc(af) < n && guard++ < 50) { const i = Math.floor(rnd() * AFF.length); if (boss && i === 5) continue; af |= 1 << i; }
  return af;
}
const affNames = af => AFF.filter((a, i) => af >> i & 1).map(a => a.n).join(', ');
const unlockKills = n => n < 3 ? 0 : Math.round(6 * Math.pow(n - 2, 1.6));

/* ---------- биомы ---------- */
const BIOMES = [
  { n: 'Зелёный луг',      g: ['#3d7a3a', '#356b33', '#5a9a4a'], m: [0, 9, 3], h: [110, 20, 90] },
  { n: 'Тёмный лес',       g: ['#24452a', '#1e3a23', '#3b6a3a'], m: [8, 3, 1], h: [280, 100, 30] },
  { n: 'Гнилое болото',    g: ['#3b4a2a', '#2f3d22', '#56663a'], m: [0, 5, 9], h: [70, 320, 160] },
  { n: 'Пустыня костей',   g: ['#b39556', '#a48748', '#c9ad6e'], m: [8, 7, 2], h: [30, 40, 50] },
  { n: 'Древний склеп',    g: ['#3a3a46', '#30303b', '#4a4a5a'], m: [2, 4, 1], h: [60, 190, 260] },
  { n: 'Ледяные пики',     g: ['#a9c6d8', '#97b6ca', '#c9e0ee'], m: [7, 4, 5], h: [200, 180, 220] },
  { n: 'Пылающий вулкан',  g: ['#4a2020', '#3b1818', '#6a2a1a'], m: [6, 0, 7], h: [0, 20, 15] },
  { n: 'Бездна',           g: ['#1b1530', '#150f26', '#2a2048'], m: [5, 6, 4], h: [270, 300, 240] },
  { n: 'Небесные чертоги', g: ['#d8d2b8', '#c9c2a5', '#eee8cc'], m: [4, 6, 2], h: [50, 200, 0] },
];
const ZONES_PER_BIOME = 5;
function biomeOf(z) {
  const bi = Math.floor((z - 1) / ZONES_PER_BIOME);
  const b = BIOMES[bi % BIOMES.length], cyc = Math.floor(bi / BIOMES.length);
  const sh = cyc * 53;
  return { name: b.n + (cyc ? ' ' + roman(cyc + 1) : ''), g: b.g.map(c => cyc ? hueShift(c, sh) : c), m: b.m, h: b.h.map(h => h + sh), cyc };
}

/* ---------- пиксельные спрайты 8x8 ---------- */
const HERO = ["..111...", ".11331..", ".11111..", "..222...", ".12221..", ".1.2.1..", "..2.2...", "..1.1..."];
const MOBS = [
  { n: 'Слизень',   s: 1,   hp: 1,   dm: 1,   p: ["........","........","..1111..",".111111.",".131131.","11111111","12222221",".222222."] },
  { n: 'Нетопырь',  s: 1.6, hp: .6,  dm: .7,  p: ["........","1......1","11.11.11","11111111",".113311.","..1111..","...11...","........"] },
  { n: 'Скелет',    s: 1.1, hp: 1,   dm: 1.2, p: ["..111...",".13131..",".11111..","..2.2...",".11111..","1.111.1.","..1.1...",".11.11.."] },
  { n: 'Гоблин',    s: 1.3, hp: .9,  dm: 1,   p: ["........","1.111.1.",".13131..",".11111..","..222...",".12221..","..2.2...","..1.1..."] },

/* ---------- основной цикл ---------- */
let spawnT = 0, pressT = 0, kpsT = 0, uiT = 0, saveT = 0;

  if (spawnT <= 0 && mobs.length < want) { const n = Math.min(want - mobs.length, 1 + Math.floor(S.zone / 15)); for (let i = 0; i < Math.min(n, 4); i++) spawnMob(false); spawnT = mobs.length < want / 2 ? .1 : .3; }
  if (!bossAlive && S.zk >= zoneNeed()) spawnMob(true);

        if (rnd() < .35) ftext(hero.x + (rnd() - .5) * 6, hero.y - 9, '-' + fmt(dmg), '#ff6b6b', .8, .6);
        if (D.thorns > .02) hitMob(m, D.hit * D.thorns, false, false, '#cc9966');
        if (sy(3)) for (const o of mobs) if (o !== m && !o.dead && Math.hypot(o.x - hero.x, o.y - hero.y) < 12) hitMob(o, D.hit * D.thorns * .5, false, false, '#cc9966');

  }

  for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 60 * dt; p.vx *= .96; p.l -= dt; }
  parts = parts.filter(p => p.l > 0);

}

function pix(x, y, c) { ctx.fillStyle = c; ctx.fillRect(x | 0, y | 0, 1, 1); }

function drawHero(rk) {

  SYN.forEach((y, i) => {
    const l = sy(i), A = EFF[y.a], B = EFF[y.b];
    if (l) h += `<div class="syn"><div class="r"><span style="color:${A.c}">${y.n}</span><span style="color:#a58bff">ур. ${l}</span></div><div class="sd"><span style="color:${A.c}">${A.n}</span> + <span style="color:${B.c}">${B.n}</span> · ${y.d}</div></div>`;
    else {
      const ka = (R[A.k] || 0) >= SYN_TH / 4, kb = (R[B.k] || 0) >= SYN_TH / 4;
      h += `<div class="syn lk"><div class="r"><span>???</span><span>скрыто</span></div><div class="sd">${ka ? A.n : '?'} + ${kb ? B.n : '?'} · прокачай оба</div></div>`;
    }
  });
  $('ylist').innerHTML = h;
}
$('ptog').onclick = () => { S.panelSmall = !S.panelSmall; applyPanel(); };
function applyPanel() { $('panel').classList.toggle('small', S.panelSmall); $('ptog').textContent = S.panelSmall ? '▲' : '▼'; setTimeout(resize, 220); }

/* ---------- сохранение и офлайн-прогресс ---------- */
function save() {
  S.vals = stats.map(s => s.v); S.lv = stats.map(s => s.lvl); S.t = Date.now(); S.hpf = hero.hp / D.maxHP;
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {}
}
function load() {
  try { const d = JSON.parse(localStorage.getItem(SAVE_KEY)); if (d && d.vals) S = Object.assign(S, d); } catch (e) {}
}
function offline(sec) {
  if (sec < 20) return;
  const kills = Math.floor(sec * Math.max(.1, S.kps) * .5);
  if (kills < 1) return;
  const z0 = S.zone, s0 = stats.length, k0 = S.kills;
  let left = kills, it = 0, evos = 0;
  mobs = []; bossAlive = false;
  while (left > 0 && it < 200000) {
    if (it++ % 25 === 0) recalc();
    const k = Math.max(1, Math.min(left, zoneNeed() - S.zk));
    const g = k * zs() * D.gainMult * 3.5 * (1 + D.rare * 7);
    const picks = Math.min(stats.length, 12);
    for (let p = 0; p < picks; p++) { const s = pickStat(); s.v += g / picks * (.6 + rnd() * .8); evos += tryEvolve(s, true); }
    S.kills += k; S.zk += k; left -= k;
    if (S.zk >= zoneNeed()) { S.zone++; S.zk = 0; }
    checkUnlocks(true);
  }
  recalc(); buildGround();
  const nsyn = synNew.length; synNew = [];
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60);
  $('mt').textContent = 'ПОКА ТЕБЯ НЕ БЫЛО';
  $('mp').innerHTML = `Прошло: ${h ? h + 'ч ' : ''}${m}м<br>Герой дрался дальше:<br><br>+${fmt(S.kills - k0)} убийств<br>` +
    `Зона ${z0} → <span style="color:#f2c94c">${S.zone}</span><br>Новых статов: <span style="color:#5cff8a">${stats.length - s0}</span><br>Эволюций: <span style="color:#bb88ff">${evos}</span>${nsyn ? '<br>Синергий: <span style="color:#ff44ff">+' + nsyn + '</span>' : ''}`;
  $('modal').hidden = false;
}
$('mok').onclick = () => { $('modal').hidden = true; audio(); };

let hiddenAt = 0;
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { hiddenAt = Date.now(); save(); }
  else if (hiddenAt) { offline((Date.now() - hiddenAt) / 1000); hiddenAt = 0; last = performance.now(); }
});
window.addEventListener('pagehide', save);
window.addEventListener('resize', () => setTimeout(resize, 50));

/* ---------- старт ---------- */
load();
for (let i = 0; i < 3; i++) { const s = makeStat(i); if (S.vals[i] !== undefined) s.v = S.vals[i]; if (S.lv && S.lv[i]) setLvl(s, S.lv[i]); stats.push(s); addStatRow(s, false); }
if (!S.vals.length) { stats[0].v = 2; stats[1].v = 3; stats[2].v = 1; }
checkUnlocks(true);
recalc();
hero.hp = D.maxHP * clamp(S.hpf || 1, .3, 1);
$('mute').textContent = S.mute ? '♪ ВЫКЛ' : '♪ ВКЛ';
$('panel').classList.toggle('small', !!S.panelSmall); $('ptog').textContent = S.panelSmall ? '▲' : '▼';
resize();
hero.x = W / 2; hero.y = H / 2;
const away = (Date.now() - (S.t || Date.now())) / 1000;
if (S.kills > 0 && away > 20) offline(away);
else if (S.kills === 0) { $('mt').textContent = 'БЕСКОНЕЧНАЯ ДРАКА'; $('mp').innerHTML = 'Герой дерётся сам.<br>Каждое убийство даёт статы.<br>Статы бесконечны.<br><br><span style="color:#fff8a0">Тапай по врагам</span> — бей молнией с неба!<br><br>Держи <span style="color:#ffdd44">комбо</span>, качай пары статов ради <span style="color:#ff44ff">синергий</span>.<br><br><span style="color:#8a83a6">Низкое HP = меньше наград.</span>'; $('modal').hidden = false; }
document.fonts && document.fonts.ready.then(() => updateUI());

let last = performance.now();
function frame(now) {
  const real = Math.min(.05, (now - last) / 1000); last = now;
  slowT -= real; flashT -= real;
  update(slowT > 0 ? real * .3 : real); render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
