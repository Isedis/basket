name: Windows updater validation
on:
  workflow_dispatch:
  push:
    branches: [opora-update-hardening, opora-startup-repair, opora-managed-repair, opora-portable, opora-startup-animation, opora-real-release-update, opora]
    paths: ['desktop/**', 'src/**', 'ui/**', 'mcp/**', 'scripts/**', 'test/**', 'distribution/**', 'package*.json', '.github/workflows/windows-update.yml']
permissions:
  contents: write
concurrency:
  group: windows-updater-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      - name: Extract exact published Windows artifact
        run: python -c "import pathlib,zipfile,io; r=pathlib.Path('distribution/windows'); data=b''.join(p.read_bytes() for p in sorted(r.glob('*.part*'))); zipfile.ZipFile(io.BytesIO(data)).extractall('release')"
      - name: Production binary startup with retained and broken settings
        id: startup
        env:
          OPORA_REPORT: ${{ runner.temp }}/opora-startup.json
        run: node scripts/startup-smoke.cjs
      - name: Direct EXE launch beside a stuck legacy installation
        id: portable
        env:
          OPORA_REPORT: ${{ runner.temp }}/opora-portable.json
        run: node scripts/portable-smoke.cjs
      - name: Visible native relaunch of the actual release EXE
        id: release
        env:
          OPORA_REPORT: ${{ runner.temp }}/opora-release.json
          OPORA_SCREENSHOT: ${{ runner.temp }}/opora-release.png
        run: node scripts/release-update-smoke.cjs
      - name: Transition from published 0.13 without a blank window
        id: oldbase
        env:
          OPORA_REPORT: ${{ runner.temp }}/opora-oldbase.json
          OPORA_SCREENSHOT: ${{ runner.temp }}/opora-oldbase.png
          OPORA_TEST_OLD_BASE: '1'
        run: node scripts/release-update-smoke.cjs
      - name: Installer protocol unit tests
        id: unit
        run: |
          npm test > "$env:RUNNER_TEMP/unit.log" 2>&1
          $code=$LASTEXITCODE
          Get-Content "$env:RUNNER_TEMP/unit.log"
          exit $code
      - name: Real Windows button, Claude PTY and live MCP
        id: native
        env:
          OPORA_REPORT: ${{ runner.temp }}/opora-native.json
        run: node scripts/native-update-smoke.cjs
      - name: Failed new GUI restores previous version
        id: rollback
        env:
          OPORA_REPORT: ${{ runner.temp }}/opora-rollback.json
          OPORA_TEST_UPDATE_FAILURE: launch
        run: node scripts/native-update-smoke.cjs
      - name: Publish machine-readable validation result
        if: always()
        uses: actions/github-script@v7
        env:
          RELEASE_RESULT: ${{ steps.release.outcome }}
          OLDBASE_RESULT: ${{ steps.oldbase.outcome }}
          UNIT_RESULT: ${{ steps.unit.outcome }}
          NATIVE_RESULT: ${{ steps.native.outcome }}
          ROLLBACK_RESULT: ${{ steps.rollback.outcome }}
          STARTUP_RESULT: ${{ steps.startup.outcome }}
          PORTABLE_RESULT: ${{ steps.portable.outcome }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const read = name => { try { return JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP, name))); } catch { return null; } };
            const report = {
              commit: context.sha, run: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              checkedAt: new Date().toISOString(), platform: 'windows-latest',
              steps: {release:process.env.RELEASE_RESULT,oldbase:process.env.OLDBASE_RESULT,portable:process.env.PORTABLE_RESULT,startup:process.env.STARTUP_RESULT,unit: process.env.UNIT_RESULT, powershell51: process.env.PS_RESULT, native: process.env.NATIVE_RESULT, rollback: process.env.ROLLBACK_RESULT, migration: process.env.MIGRATION_RESULT},
              release:read('opora-release.json'),oldbase:read('opora-oldbase.json'),portable:read('opora-portable.json'),startup:read('opora-startup.json'),native: read('opora-native.json'), rollback: read('opora-rollback.json'), migration: read('opora-migration.json')
            };
            if(process.env.UNIT_RESULT === 'failure') { try { report.unitLog = fs.readFileSync(path.join(process.env.RUNNER_TEMP,'unit.log'),'utf8').slice(-8000); } catch {} }
            const branch = 'opora-windows-validation';
            try { await github.rest.git.getRef({...context.repo, ref: 'heads/' + branch}); }
            catch (error) { if(error.status !== 404) throw error; await github.rest.git.createRef({...context.repo, ref: 'refs/heads/' + branch, sha: context.sha}); }
            let sha;
            try { sha = (await github.rest.repos.getContent({...context.repo, path: 'windows-update.json', ref: branch})).data.sha; } catch(error) { if(error.status !== 404) throw error; }
            await github.rest.repos.createOrUpdateFileContents({...context.repo, branch, path: 'windows-update.json', sha, message: 'Record Windows updater validation ' + context.sha.slice(0, 12), content: Buffer.from(JSON.stringify(report, null, 2) + '\n').toString('base64')});
            for(const name of ['opora-release.png','opora-oldbase.png']){
              const file=path.join(process.env.RUNNER_TEMP,name);if(!fs.existsSync(file))continue;let sha;
              try{sha=(await github.rest.repos.getContent({...context.repo,path:name,ref:branch})).data.sha;}catch{}
              await github.rest.repos.createOrUpdateFileContents({...context.repo,branch,path:name,sha,message:'Record rendered update window',content:fs.readFileSync(file).toString('base64')});
            }
      - name: Publish the tested ready-to-run ZIP on GitHub Releases
        if: success() && (github.ref == 'refs/heads/opora-real-release-update' || github.ref == 'refs/heads/opora-startup-animation' || github.ref == 'refs/heads/opora-portable' || github.ref == 'refs/heads/opora')
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'),path=require('path'),crypto=require('crypto');
            const manifest=JSON.parse(fs.readFileSync('distribution/windows/manifest.json'));
            if(!/^0\.14\.\d+$/.test(manifest.version))return;
            const parts=manifest.parts.map(p=>fs.readFileSync(path.join('distribution/windows',p.name)));
            const zip=Buffer.concat(parts),hash=crypto.createHash('sha256').update(zip).digest('hex');
            if(hash!==manifest.sha256)throw new Error('Portable archive SHA mismatch');
            const tag='v'+manifest.version;let release;
            try{release=(await github.rest.repos.getReleaseByTag({...context.repo,tag})).data;}
            catch(error){if(error.status!==404)throw error;release=(await github.rest.repos.createRelease({...context.repo,tag_name:tag,target_commitish:context.sha,name:'Опора '+manifest.version,draft:true,body:'Готовое приложение для Windows 10/11 x64. Скачайте Opora-Windows.zip, распакуйте и откройте Opora.exe. Папку старой Опоры заменять не нужно. Существующие пометки и брендбук остаются в папке игры.'})).data;}
            const assets=(await github.rest.repos.listReleaseAssets({...context.repo,release_id:release.id})).data;
            const existing=assets.find(a=>a.name==='Opora-Windows.zip');
            if(existing){
              if(existing.digest!=='sha256:'+hash)throw new Error('A different portable ZIP already exists for this version');
            }else await github.rest.repos.uploadReleaseAsset({...context.repo,release_id:release.id,name:'Opora-Windows.zip',headers:{'content-type':'application/zip','content-length':zip.length},data:zip});
            if(!assets.some(a=>a.name==='Opora-Windows.zip.sha256')){
              const checksum=Buffer.from(hash+'  Opora-Windows.zip\n');
              await github.rest.repos.uploadReleaseAsset({...context.repo,release_id:release.id,name:'Opora-Windows.zip.sha256',headers:{'content-type':'text/plain','content-length':checksum.length},data:checksum});
            }
            await github.rest.repos.updateRelease({...context.repo,release_id:release.id,draft:false,make_latest:'true'});
            core.info('Ready-to-run download: '+release.html_url+'/../download/'+tag+'/Opora-Windows.zip');
