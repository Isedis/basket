name: Flesh and Vow releases
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['flesh-and-vow/**', '.github/workflows/flesh-and-vow-release.yml']
permissions:
  contents: write
concurrency:
  group: flesh-and-vow-release
  cancel-in-progress: false
jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test Windows updater
        shell: powershell
        run: |
          & ./flesh-and-vow/tests/install-update.ps1
          & ./flesh-and-vow/tests/install-patch.ps1
  release:
    needs: windows-installer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.6.3
        run: |
          curl -fL --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.6.3-stable_linux.x86_64
          echo /tmp/godot >> "$GITHUB_PATH"
          curl -fL --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_export_templates.tpz -o /tmp/templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.6.3.stable
          unzip -p /tmp/templates.tpz templates/windows_release_x86_64.exe > ~/.local/share/godot/export_templates/4.6.3.stable/windows_release_x86_64.exe
      - name: Import and test
        run: |
          Godot_v4.6.3-stable_linux.x86_64 --headless --path flesh-and-vow --editor --import --quit
          Godot_v4.6.3-stable_linux.x86_64 --headless --path flesh-and-vow --script res://tests/smoke.gd
          Godot_v4.6.3-stable_linux.x86_64 --headless --path flesh-and-vow --script res://tests/updater.gd
          Godot_v4.6.3-stable_linux.x86_64 --headless --path flesh-and-vow --script res://tests/art.gd
          Godot_v4.6.3-stable_linux.x86_64 --headless --path flesh-and-vow --script res://tests/locomotion.gd
          Godot_v4.6.3-stable_linux.x86_64 --headless --path flesh-and-vow --script res://tests/combat.gd
          Godot_v4.6.3-stable_linux.x86_64 --headless --path flesh-and-vow --script res://tests/directions.gd
          Godot_v4.6.3-stable_linux.x86_64 --headless --path flesh-and-vow --script res://tests/grip.gd
          Godot_v4.6.3-stable_linux.x86_64 --headless --path flesh-and-vow --script res://tests/weight.gd
          Godot_v4.6.3-stable_linux.x86_64 --headless --path flesh-and-vow --script res://tests/characters.gd
          Godot_v4.6.3-stable_linux.x86_64 --headless --path flesh-and-vow --script res://tests/enemies.gd
          Godot_v4.6.3-stable_linux.x86_64 --headless --path flesh-and-vow --script res://tests/boss.gd
          Godot_v4.6.3-stable_linux.x86_64 --headless --path flesh-and-vow --script res://tests/boss_anatomy.gd
          Godot_v4.6.3-stable_linux.x86_64 --headless --path flesh-and-vow --script res://tests/boss_contact.gd
          Godot_v4.6.3-stable_linux.x86_64 --headless --path flesh-and-vow --script res://tests/boss_phase.gd
          Godot_v4.6.3-stable_linux.x86_64 --headless --path flesh-and-vow --script res://tests/boss_charge.gd
          Godot_v4.6.3-stable_linux.x86_64 --headless --path flesh-and-vow --script res://tests/boss_toll.gd
          Godot_v4.6.3-stable_linux.x86_64 --headless --path flesh-and-vow --script res://tests/boss_entrance.gd
          Godot_v4.6.3-stable_linux.x86_64 --headless --path flesh-and-vow --script res://tests/boss_wounds.gd
          Godot_v4.6.3-stable_linux.x86_64 --headless --path flesh-and-vow --script res://tests/boss_rhythm.gd
          Godot_v4.6.3-stable_linux.x86_64 --headless --path flesh-and-vow --script res://tests/castle.gd
          Godot_v4.6.3-stable_linux.x86_64 --headless --path flesh-and-vow --script res://tests/doors.gd
          Godot_v4.6.3-stable_linux.x86_64 --headless --path flesh-and-vow --script res://tests/castle_hall.gd
          Godot_v4.6.3-stable_linux.x86_64 --headless --path flesh-and-vow --script res://tests/castle_floor.gd
          Godot_v4.6.3-stable_linux.x86_64 --headless --path flesh-and-vow --script res://tests/hazards.gd
          Godot_v4.6.3-stable_linux.x86_64 --headless --path flesh-and-vow --script res://tests/patches.gd
          python3 flesh-and-vow/tests/content_packs.py --godot Godot_v4.6.3-stable_linux.x86_64 --project flesh-and-vow
          python3 flesh-and-vow/tests/exported_patch.py --godot Godot_v4.6.3-stable_linux.x86_64 --project flesh-and-vow
      - name: Build Windows
        run: |
          mkdir -p dist/FleshAndVow-Windows
          Godot_v4.6.3-stable_linux.x86_64 --headless --path flesh-and-vow --export-release 'Windows Desktop' "$PWD/dist/FleshAndVow-Windows/FleshAndVow.exe"
          Godot_v4.6.3-stable_linux.x86_64 --headless --path flesh-and-vow --export-pack 'Windows Desktop' "$PWD/dist/content.zip"
          cp flesh-and-vow/assets/*LICENSE.txt dist/FleshAndVow-Windows/
          cp flesh-and-vow/README.md dist/FleshAndVow-Windows/README-RU.md
          cd dist && zip -qr FleshAndVow-Windows.zip FleshAndVow-Windows
      - name: Test compiled complete boss silhouette
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb xauth libgl1-mesa-dri libxinerama1 libxcursor1 libxi6 libxrandr2 libxrender1
          python3 -m venv "$RUNNER_TEMP/boss-render-env"
          "$RUNNER_TEMP/boss-render-env/bin/python" -m pip install pillow
          "$RUNNER_TEMP/boss-render-env/bin/python" flesh-and-vow/tests/boss_silhouette.py --godot Godot_v4.6.3-stable_linux.x86_64 --project flesh-and-vow --pack "$PWD/dist/FleshAndVow-Windows/FleshAndVow.exe"
      - name: Publish game and update feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 flesh-and-vow/tools/publish_release.py
