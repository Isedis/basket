name: Published release update investigation
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      - name: Actual 0.13.0 to 0.13.1 button update
        env:
          OPORA_REPORT: ${{ runner.temp }}/published.json
          OPORA_SCREENSHOT: ${{ runner.temp }}/published.png
        run: node scripts/published-update-smoke.cjs
      - name: Publish diagnostics
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'),path=require('path'),branch='opora-published-validation';
            try{await github.rest.git.getRef({...context.repo,ref:'heads/'+branch});}catch(e){if(e.status!==404)throw e;await github.rest.git.createRef({...context.repo,ref:'refs/heads/'+branch,sha:context.sha});}
            for(const name of ['published.json','published.png']){
              const file=path.join(process.env.RUNNER_TEMP,name);if(!fs.existsSync(file))continue;
              let sha;try{sha=(await github.rest.repos.getContent({...context.repo,path:name,ref:branch})).data.sha;}catch{}
              await github.rest.repos.createOrUpdateFileContents({...context.repo,branch,path:name,sha,message:'Record published update investigation',content:fs.readFileSync(file).toString('base64')});
            }
