<script>/* Shared context format for desktop and demo. No network or filesystem access. */
function validateState(state) {
  if (!state || state.version !== 1 || typeof state.name !== 'string' || !state.name.trim()) throw new Error('Укажите название игры.');
  for (const key of ['genre', 'pitch', 'experience', 'goal', 'pillars', 'rules']) {
    if (typeof state[key] !== 'string') throw new Error(`Некорректное поле: ${key}`);
  }
  if (!state.brand || !['draft', 'approved'].includes(state.brand.status)) throw new Error('Некорректный статус брендбука.');
  for (const key of ['palette', 'fonts', 'direction', 'avoid']) if (typeof state.brand[key] !== 'string') throw new Error(`Некорректное поле стиля: ${key}`);
  if (state.brand.analysis !== undefined) {
    const a=state.brand.analysis;
    const bad=()=>{throw new Error('Повреждён отчёт анализа брендбука.');};
    if(!a || a.version!==1 || typeof a.scannedAt!=='string' || !a.stats || !Array.isArray(a.warnings) || a.warnings.some(w=>typeof w!=='string'))bad();
    for(const key of ['colors','imageColors','fonts','fontSizes','metrics','assets'])if(!Array.isArray(a[key]) || a[key].length>32)bad();
    for(const item of [...a.colors,...a.imageColors,...a.fontSizes,...a.metrics]) {
      if(!item || !Array.isArray(item.sources) || item.sources.some(s=>!s || typeof s.file!=='string' || !Number.isInteger(s.line) || typeof s.property!=='string'))bad();
    }
    if([...a.colors,...a.imageColors].some(c=>!/^#[0-9A-F]{6}(?:[0-9A-F]{2})?$/.test(c.hex)))bad();
    if(a.fonts.some(f=>!f || typeof f.file!=='string' || !Array.isArray(f.sources)) || a.assets.some(f=>!f || typeof f.file!=='string'))bad();
  }
  if (!Array.isArray(state.tasks) || !Array.isArray(state.references)) throw new Error('Повреждены задачи или эталоны.');
  const ids = new Set();
  for (const task of state.tasks) {
    if (!task || typeof task.id !== 'string' || ids.has(task.id) || typeof task.title !== 'string' || typeof task.acceptance !== 'string' || !['backlog', 'active', 'done'].includes(task.status)) throw new Error('Некорректная задача.');
    ids.add(task.id);
  }
  if (state.activeTaskId && !ids.has(state.activeTaskId)) throw new Error('Выбранная задача не найдена.');
  for (const ref of state.references) {
    if (!ref || typeof ref.id !== 'string' || typeof ref.name !== 'string' || !/^\.opora\/references\/[a-zA-Z0-9_-]+\.(png|jpe?g|webp)$/.test(ref.file) || !['draft', 'approved'].includes(ref.status)) throw new Error('Некорректный визуальный эталон.');
  }
  return state;
}

function contextMarkdown(state) {
  validateState(state);
  const s = state;
  const brandStatus = s.brand.status === 'approved' ? 'УТВЕРЖДЁН пользователем' : 'ЧЕРНОВИК — окончательные визуальные решения не утверждены';
  const active = s.tasks.find(t => t.id === s.activeTaskId && t.status !== 'done');
  const text = v => v.trim() || 'Не задано. Не считать это принятым решением.';
  return `# ${s.name}: общий контекст игры

Эту памятку создаёт Opora. Меняйте решения через приложение; изменения здесь могут быть заменены при следующей синхронизации.
Актуальность: ${s.updatedAt || 'не указана'}. Движок: Godot.

## Игра
Жанр: ${text(s.genre)}

Замысел: ${text(s.pitch)}

Ощущение игрока: ${text(s.experience)}

## Основы, которые нужно сохранять
${text(s.pillars)}

## Текущая цель
${text(s.goal)}

## Брендбук
Статус: ${brandStatus}

### Визуальное направление
${text(s.brand.direction)}

### Палитра
${text(s.brand.palette)}

### Шрифты и типографика
${text(s.brand.fonts)}

### Не использовать
${text(s.brand.avoid)}

${s.brand.analysis ? `### Основание автоматического черновика
Сканирование файлов: ${s.brand.analysis.scannedAt}. Игра при этом не запускалась.
Найденные объявления цветов:\n${s.brand.analysis.colors.slice(0,12).map(c=>`- ${c.hex}: ${c.sources.map(p=>p.file+':'+p.line).join(', ')}`).join('\n') || 'Не найдены; палитра может быть приблизительно извлечена из изображений.'}
Ограничения:\n${s.brand.analysis.warnings.map(w=>'- '+w).join('\n')}
Выбор основного стиля остаётся за пользователем. Найденные файлы не становятся эталонами автоматически.
` : ''}

### Эталоны (пути от корня проекта)
${s.references.length ? s.references.map(r => `- [${r.status === 'approved' ? 'УТВЕРЖДЁН' : 'КАНДИДАТ, не эталон'}] ${r.name}: ${r.file}`).join('\n') : 'Эталоны ещё не добавлены. Не заявлять визуальное соответствие без эталонов.'}

## Постоянные замечания пользователя
${text(s.rules)}

## Выбранная задача
${active ? `${active.title}\n\nКритерии готовности:\n${text(active.acceptance)}` : 'Нет выбранной незавершённой задачи. Уточнить конкретный запрос пользователя.'}

## Остальные задачи
${s.tasks.filter(t => t.id !== active?.id).map(t => `- [${({backlog:'в очереди', active:'в работе', done:'готово'})[t.status]}] ${t.title}`).join('\n') || 'Нет.'}

## Завершение работы
Проверь критерии выбранной задачи, сохрани существующие решения вне её рамок.
Сообщи, что изменилось, что проверено и что требует просмотра в Godot.
Эта памятка не доказывает, что агент её прочёл или что результат соответствует стилю.
`;
}

function taskBrief(state) {
  return `Работаем над проектом Godot «${state.name}».
Сначала перечитай AGENTS.md или CLAUDE.md, затем .opora/CONTEXT.md и перечисленные визуальные эталоны.
Выполни выбранную в памятке задачу по её критериям готовности.
Если выбранной задачи нет, сначала уточни конкретную задачу.
Ниже — текущая версия контекста на случай, если файлы ещё не синхронизированы.

${contextMarkdown(state)}`;
}


const OporaContext = {validateState, contextMarkdown, taskBrief};
if (typeof module !== 'undefined' && module.exports) module.exports = OporaContext;
</script><script>/* Explainable checks of brandbook instructions. No image/model analysis. */
function parseBrandHex(value) {
  const match=String(value).trim().match(/^#([a-f0-9]{3}|[a-f0-9]{4}|[a-f0-9]{6}|[a-f0-9]{8})$/i);
  if(!match)return null;
  let digits=match[1];if(digits.length<=4)digits=[...digits].map(c=>c+c).join('');
  const rgb=[0,2,4].map(i=>parseInt(digits.slice(i,i+2),16));
  const alpha=digits.length===8?parseInt(digits.slice(6),16):255;
  return {hex:'#'+digits.slice(0,6).toUpperCase()+(alpha===255?'':digits.slice(6).toUpperCase()),rgb,alpha};
}
function brandContrast(a,b) {
  const left=typeof a==='string'?parseBrandHex(a):a;
  const right=typeof b==='string'?parseBrandHex(b):b;
  if(!left || !right || left.alpha!==255 || right.alpha!==255)return null;
  const luminance=c=>c.rgb.map(v=>v/255).map(v=>v<=0.04045?v/12.92:((v+0.055)/1.055)**2.4).reduce((sum,v,i)=>sum+v*[0.2126,0.7152,0.0722][i],0);
  const l=luminance(left),r=luminance(right);
  return (Math.max(l,r)+0.05)/(Math.min(l,r)+0.05);
}
function formatBrandRatio(value){return (Math.floor(value*100)/100).toFixed(2);}
function reviewSignature(state){return JSON.stringify({brand:state.brand,references:state.references});}

function assessBrandbook(state,options={}) {
  const brand=state.brand||{};
  const refs=state.references||[];
  const fields=Object.fromEntries(['direction','palette','fonts','avoid'].map(k=>[k,String(brand[k]||'').slice(0,65536)]));
  const checks=[],findings=[],pairs=[],colors=new Map();
  const add=(id,severity,title,detail,suggestion,field,acceptance)=>findings.push({id,severity,title,detail,suggestion,field,acceptance:acceptance||suggestion});
  const check=(id,label,status)=>checks.push({id,label,status});
  const unknown=/назначение не|роль не|не утвержден|объявлен в файлах|приблизительно из изображения|не задан|не выбран|не определ|пока не|todo|tbd/iu;
  const textRole=/(?:^|[^\p{L}\p{N}_])(текст(?:а|ом)?|надпис[ьи]|подпис[ьи]|заголов[\p{L}]*|text|foreground|font[ _]color)(?:$|[^\p{L}\p{N}_])/iu;
  const bgRole=/(?:^|[^\p{L}\p{N}_])(фон(?:а|е)?|background|bg)(?:$|[^\p{L}\p{N}_])/iu;
  const inactiveRole=/disabled|inactive|неактивн|отключ[её]н/iu;
  const invalid=[];let tokens=0,truncated=false;
  for(const [index,line] of fields.palette.split('\n').entries()) {
    const entries=[];
    for(const match of line.matchAll(/#[a-zA-Z0-9]+/g)) {
      if(match.index>0 && /[\p{L}\p{N}_/\\]/u.test(line[match.index-1]))continue;
      if(/^\.(?:tres|tscn|gd|svg|png|jpe?g|webp)\b/i.test(line.slice(match.index+match[0].length)))continue;
      if(++tokens>256){truncated=true;break;}
      const color=parseBrandHex(match[0]);
      if(!color){invalid.push(match[0]);continue;}
      const entry={...color,line:index+1,offset:match.index,end:match.index+match[0].length,description:line};
      entries.push(entry);
      const description=line.replace(/#[a-zA-Z0-9]+/g,'').replace(/(?:res:\/\/)?\S+\.(?:tres|tscn|gd|png|jpe?g|webp|svg)(?::\d+)?/gi,'').replace(/[\s:;—–\-(),.\d]/g,'');
      const named=!unknown.test(line) && /\p{L}{2}/u.test(description);
      if(!colors.has(color.hex))colors.set(color.hex,{...color,named:false,roles:[],largeText:false,regularText:false});
      const saved=colors.get(color.hex);saved.named ||= named;
      if(!unknown.test(line)) {
        if(textRole.test(line)) {
          if(!saved.roles.includes('text'))saved.roles.push('text');
          if(/крупн[\p{L}]*\s+текст|large\s+text/iu.test(line))saved.largeText=true;else saved.regularText=true;
        }
        if(bgRole.test(line) && !saved.roles.includes('background'))saved.roles.push('background');
      }
    }
    // Only infer pairs that the user explicitly wrote as text-on-background.
    if(entries.length===2 && textRole.test(line) && /(?:\sна\s|\son\s)/iu.test(line.slice(entries[0].end,entries[1].offset)) && !unknown.test(line)) {
      pairs.push({foreground:entries[0].hex,background:entries[1].hex,label:line.slice(0,entries[0].offset).replace(/[:\s]+$/,'')||'Текстовая пара',largeText:/крупн[\p{L}]*\s+текст|large\s+text/iu.test(line),excluded:inactiveRole.test(line),line:index+1});
    }
    if(truncated)break;
  }
  const palette=[...colors.values()];
  if(!pairs.length) {
    const texts=palette.filter(c=>c.roles.includes('text')&&!c.roles.includes('background'));
    const backgrounds=palette.filter(c=>c.roles.includes('background')&&!c.roles.includes('text'));
    // A color intentionally used for both roles still needs the 1:1 check.
    const both=palette.filter(c=>c.roles.includes('text')&&c.roles.includes('background'));
    if(texts.length===1 && backgrounds.length===1)pairs.push({foreground:texts[0].hex,background:backgrounds[0].hex,label:'Текст и фон по указанным ролям',largeText:texts[0].largeText&&!texts[0].regularText});
    else if(!texts.length && !backgrounds.length && both.length===1)pairs.push({foreground:both[0].hex,background:both[0].hex,label:'Один цвет для текста и фона'});
  }
  if(pairs.length>20){pairs.length=20;truncated=true;}

  const directionPending=!fields.direction.trim() || /художественное направление и настроение пока не установлены/iu.test(fields.direction) || /^(?:не знаю|пока не знаю|не определ[её]но|не задано|пока нет|todo|tbd)[\s.!]*$/iu.test(fields.direction.trim()) || /^(?:сделать\s+)?(?:красиво|стильно|современно|атмосферно)[\s!.,]*$/iu.test(fields.direction.trim());
  check('direction','Описано визуальное направление',directionPending?'needs_info':'pass');
  if(directionPending)add('direction-missing','warning','Визуальное направление не определено',fields.direction.trim()?'Есть черновик или общее пожелание, но по нему агенту придётся выбирать стиль.':'Поле направления пустое.','Опишите настроение, формы, материалы и плотность деталей. Например: «матовые панели, тонкая обводка, сдержанные скругления, один акцент на экране».','direction','Подготовить конкретное описание направления и показать его на одном экране; окончательный вариант утверждает пользователь.');

  check('palette','Палитра содержит корректные HEX-цвета',palette.length && !invalid.length && !truncated?'pass':invalid.length?'issue':'needs_info');
  if(!palette.length)add('palette-missing','warning','Нет пригодной палитры','Корректные HEX-цвета не найдены.','Укажите цвета в формате #RRGGBB и подпишите назначение каждого.','palette');
  if(invalid.length)add('palette-invalid','error','Есть некорректные коды цвета','Не распознаны: '+[...new Set(invalid)].slice(0,8).join(', '),'Используйте #RGB, #RGBA, #RRGGBB или #RRGGBBAA. Исправьте длину кода и символы.','palette');
  const unnamed=palette.filter(c=>!c.named);
  check('roles','У цветов указано назначение',palette.length && !unnamed.length?'pass':'needs_info');
  if(unnamed.length)add('palette-roles','warning','Цвета есть, но неясно, где их применять','Без назначения: '+unnamed.slice(0,8).map(c=>c.hex).join(', '),'Подпишите фон, основной текст, панели, акцент и состояния. Автоматически найденный цвет не становится основным.','palette');
  if(palette.length>12)add('palette-many','note','Палитру стоит разделить на группы',`Найдено уникальных цветов: ${palette.length}. Большое число само по себе не является ошибкой.`,'Отделите интерфейс от цветов ассетов; выделите основные цвета и допустимые оттенки.','palette');

  const evaluated=pairs.map(pair=>{
    const ratio=brandContrast(pair.foreground,pair.background);
    const target=pair.largeText?3:4.5;
    const candidates=[...palette.map(c=>c.hex),'#FFFFFF','#000000'].filter((hex,i,array)=>array.indexOf(hex)===i).map(hex=>({hex,ratio:brandContrast(hex,pair.background),existing:palette.some(c=>c.hex===hex)})).filter(c=>c.ratio!==null && c.ratio>=target).sort((a,b)=>Number(b.existing)-Number(a.existing)||b.ratio-a.ratio);
    return {...pair,ratio,target,status:pair.excluded?'excluded':ratio===null?'unknown':ratio<target?'issue':'pass',proposal:!pair.excluded && ratio!==null && ratio<target?candidates[0]||null:null};
  });
  const tested=evaluated.filter(p=>!p.excluded);
  check('contrast','Проверены объявленные пары текста и фона',tested.length && tested.every(p=>p.status==='pass') && !truncated?'pass':tested.some(p=>p.status==='issue')?'issue':'needs_info');
  if(!tested.length)add('contrast-unspecified','warning','Пока нельзя проверить читаемость',evaluated.length?'Указаны только неактивные состояния. Пары обычного текста не заданы.':'Однозначные пары текста и фона не указаны. Случайные сочетания палитры не проверялись.','Добавьте строку «Основной текст: #FFFFFF на #151E21» или по одному явно подписанному цвету текста и фона.','palette');
  for(const pair of evaluated) {
    const id='contrast-'+pair.foreground.slice(1)+'-'+pair.background.slice(1);
    if(pair.excluded){add(id+'-inactive','note','Неактивное состояние не оценивается как обычный текст',`${pair.foreground} на ${pair.background} явно помечено как disabled / неактивное.`,'Проверьте, что неактивность понятна игроку. Низкий контраст этого состояния сам по себе не объявляется ошибкой.','palette');continue;}
    if(pair.ratio===null)add(id,'warning','Полупрозрачную пару нельзя оценить без подложки',`${pair.foreground} на ${pair.background}: итоговый цвет после наложения не задан.`,'Укажите непрозрачные итоговые цвета или проверьте сочетание на фактическом фоне в игре.','palette');
    else if(pair.ratio<pair.target)add(id,pair.ratio<3?'error':'warning','Контраст ниже выбранного ориентира',`${pair.foreground} на ${pair.background}: ${formatBrandRatio(pair.ratio)}:1 при ориентире ${pair.target}:1 ${pair.largeText?'для явно помеченного крупного':'для обычного'} текста.`,(pair.proposal?`Вариант для обсуждения: ${pair.proposal.hex} на том же фоне даёт ${formatBrandRatio(pair.proposal.ratio)}:1. `:'')+'Для крупного текста можно явно указать «Крупный текст: … на …» (3:1); реальный размер и отображение проверьте в Godot.','palette',`Предложить читаемую пару с расчётным контрастом не ниже ${pair.target}:1; изменение палитры и проверку в Godot подтверждает пользователь.`);
  }

  const fontPending=/не выбран|не определ|пока не|пока отсутств|шрифты? не найден/iu.test(fields.fonts);
  const withoutSizes=fields.fonts.replace(/\S+\.(?:tscn|tres|gd)(?::\d+)?/gi,'').replace(/\d+(?:[.,]\d+)?\s*(?:px|пкс|пиксел[\p{L}]*)/giu,'').replace(/(?:шрифт[\p{L}]*|семейство|font(?: family)?)\s*[:=]/giu,'').replace(/default_font_size|font_size|заголов[\p{L}]*|основн[\p{L}]*|текст[\p{L}]*|подпис[\p{L}]*|размер[\p{L}]*|весь интерфейс|единый размер|heading|title|body|all ui|all text/giu,'').replace(/[\s\d:;—–\-(),.]/g,'').trim();
  const fontPresent=!!withoutSizes && !fontPending;
  check('fonts','Названы шрифты',fontPresent?'pass':'needs_info');
  if(!fontPresent)add('fonts-missing','warning','Шрифт не выбран','Размеры текста или сообщение о найденных файлах не заменяют выбор семейства.','Укажите название или путь к файлу, например «Шрифт: res://fonts/Inter.ttf». Если используете системный шрифт, назовите его.','fonts');
  if(/применение не подтверждено/iu.test(fields.fonts))add('fonts-unconfirmed','note','Найденный шрифт может не использоваться','В черновике есть файл шрифта без подтверждённой ссылки.','Проверьте тему и сцены Godot; назначьте шрифт явно перед утверждением.','fonts');
  const sizes=/\d+(?:[.,]\d+)?\s*(?:px|пкс|пиксел)/iu.test(fields.fonts);
  const hierarchy=/(заголов|heading|title)/iu.test(fields.fonts) && /(основн[\p{L}]*\s+текст|текст|body)/iu.test(fields.fonts) || /(весь интерфейс|всего текста|единый размер|all (?:ui|text))/iu.test(fields.fonts);
  check('typography','Заданы размеры и роли текста',sizes && hierarchy?'pass':'needs_info');
  if(!sizes || !hierarchy)add('typography-missing','warning','Не заданы правила типографики',!sizes?'Не найдены размеры в px.':'Размеры есть, но роли основного текста и заголовков не определены.','Опишите заголовки, основной текст и подписи. Для единого размера укажите это явно. Маленький пиксельный шрифт сам по себе не считается ошибкой.','fonts');

  const approved=refs.filter(r=>r.status==='approved');
  const evidence=options.referenceEvidence;
  const unavailable=evidence?approved.filter(r=>evidence[r.id]?.status==='missing' || evidence[r.id]?.status==='unreadable'):[];
  const unverified=approved.filter(r=>!evidence || !evidence[r.id] || evidence[r.id].status==='unchecked');

async function applyBrand(report, fields, assets) {

async function scanBrand(automatic=false) {

  const files = await bridge.preview(snapshot);
  pendingSync = {state:snapshot, revision};
  showModal(`<h2 id="modal-title">Передать общий контекст</h2><p>Будут обновлены только перечисленные файлы. Код и сцены игры не меняются. В AGENTS.md и CLAUDE.md заменяется только блок Opora; остальное сохраняется.</p>${files.map(f=>`<details><summary>${escapeHtml(f.file)} ${f.existing?'· существующие инструкции сохранятся':''}</summary><pre class="code-preview">${escapeHtml(f.content)}</pre></details>`).join('')}<p>Предыдущие версии сохранятся в <span class="file-tag">.opora/backups/</span>. Данные и эталоны Opora лежат рядом с игрой: учитывайте их при публикации репозитория.</p><div class="modal-actions"><button class="button secondary" data-action="close-modal">Отмена</button><button class="button" data-action="confirm-sync">Обновить эти файлы</button></div>`);
}

document.addEventListener('input', event => {
  const key = event.target.dataset.field;
  if (!key) return;
  const parts = key.split('.');
  if (parts.length === 2) state[parts[0]][parts[1]] = event.target.value;
  else state[key] = event.target.value;
  changed();
});
document.addEventListener('change', event => {
  const taskId = event.target.dataset.taskStatus;
  if (taskId) {
    const task = state.tasks.find(t=>t.id === taskId);
    task.status = event.target.value;
    if (task.status === 'done' && state.activeTaskId === taskId) state.activeTaskId = null;
    changed(); render();
  }
  const refId = event.target.dataset.refStatus;
  if (refId) {state.references.find(r=>r.id===refId).status = event.target.value; changed();}
});
document.addEventListener('submit', event => {
  if (event.target.id !== 'task-form') return;
  event.preventDefault();
  const form = event.target;
  const data = new FormData(form);
  const title = data.get('title').trim();
  const acceptance = data.get('acceptance').trim();
  if (!title || !acceptance) {toast('Добавьте название и критерии готовности.', true); return;}
  const existing = state.tasks.find(t=>t.id === form.dataset.id);
  if (existing) Object.assign(existing,{title,acceptance});
  else state.tasks.push({id:id(),title,acceptance,status:'backlog'});
  changed(); closeModal(); render();
});
document.addEventListener('click', async event => {
  const nav = event.target.closest('[data-tab]');
  if (nav) {tab = nav.dataset.tab; render(); if(tab==='agents')await refreshAgents();return;}
  const button = event.target.closest('[data-action]');
  if (!button || button.disabled) return;
  const action = button.dataset.action;
  try {
    if (action === 'open') {button.disabled = true; try {await openProject();} finally {button.disabled = false;}}
    if (action === 'goto-context') {tab='context'; render();}
    if (action === 'goto-tasks') {tab='tasks'; render();}
    if (action === 'focus-brand-field') {
      const key=button.dataset.fieldKey;
      if(!['palette','fonts','direction','avoid','status','references'].includes(key))return;
      const field=key==='references'?document.querySelector('[data-action="add-reference"]'):document.querySelector(`[data-field="brand.${key}"]`);
      field?.scrollIntoView({behavior:'smooth',block:'center'});field?.focus({preventScroll:true});
    }
    if (action === 'review-brand') await reviewBrand(true);
    if (action === 'brand-finding-task') {
      const finding=currentBrandReview().findings.find(f=>f.id===button.dataset.id);
      if(!finding){toast('Это замечание уже устранено.');return;}
      if(state.tasks.some(t=>t.brandFindingId===finding.id && t.status!=='done'))return;
      state.tasks.push({id:id(),title:'Брендбук: '+finding.title,acceptance:`Проблема: ${finding.detail}\nПредложение: ${finding.suggestion}\nКритерий: ${finding.acceptance}\nПодготовить предложение пользователю; не менять .opora/project.json напрямую и не утверждать стиль самостоятельно.`,status:'backlog',brandFindingId:finding.id});
      changed();refreshReviewPanel();toast('Задача добавлена в очередь. Выберите её в разделе «Задачи».');
    }
    if (action === 'copy-brand-review') {
      const report=currentBrandReview();
      const text=`Разбор брендбука игры «${state.name}».\n${report.scope}\nПунктов с достаточными данными: ${report.ready}/${report.total}.\n\n${report.findings.map(f=>`${f.title}\n${f.detail}\nЧто предложить: ${f.suggestion}`).join('\n\n')}\n\n${report.contrastBasis}\nПредложи изменения на просмотр пользователю. Не утверждай стиль и не меняй .opora/project.json напрямую.`;
      if(bridge)await bridge.copy(text);else await navigator.clipboard.writeText(text);
      toast('Разбор скопирован. Агент также может получить его через MCP.');
    }
    if (action === 'refresh-agents') await refreshAgents();
    if (action === 'configure-agent') configureAgent(button.dataset.client);
    if (action === 'confirm-agent' && pendingAgent) {
      button.disabled=true;
      try {await persist();await bridge.configureAgent(pendingAgent);closeModal();await refreshAgents();toast('Настройки сохранены. Перезапустите сессию агента в папке игры.');} finally {button.disabled=false;}
    }
    if (action === 'copy-agent-start' && agentConnection) {
      await bridge.copy(`Работаем над игрой «${state.name}» в папке ${agentConnection.root}. Используй MCP-сервер ${agentConnection.server_name}: сначала opora_get_project, проверь папку, затем opora_get_context и брендбук. Выполни выбранную задачу. Перед отправкой отчёта используй актуальную revision. Незапущенные проверки отметь not_run. Результат отправь через opora_report_progress со статусом ready_for_review; завершение подтверждает пользователь.`);
      toast('Первый запрос скопирован. Вставьте его в новую сессию агента.');
    }
    if (action === 'updates') await showUpdates();
    if (action === 'check-updates') {button.disabled=true;try {updateState={...updateState,...await bridge.checkUpdates()};if(updatesOpen)renderUpdates();} finally {button.disabled=false;}}
    if (action === 'download-update') {button.disabled=true;try {updateState={...updateState,...await bridge.downloadUpdate()};if(updatesOpen)renderUpdates();} finally {button.disabled=false;}}
    if (action === 'install-update') {
      button.disabled=true;
      try {await persist();await saves;await bridge.installUpdate();} finally {button.disabled=false;}
    }
    if (action === 'scan-brand') await scanBrand();
    if (action === 'apply-brand' && pendingBrand) {
      button.disabled=true;
      try {await applyBrand(pendingBrand,[...document.querySelectorAll('[data-brand-field]:checked')].map(e=>e.dataset.brandField),[...document.querySelectorAll('[data-brand-asset]:checked')].map(e=>e.dataset.brandAsset));} finally {button.disabled=false;}
    }
    if (action === 'new-task') editTask();
    if (action === 'edit-task') editTask(button.dataset.id);
    if (action === 'delete-task') {
      state.tasks = state.tasks.filter(t=>t.id !== button.dataset.id);
      if (state.activeTaskId === button.dataset.id) state.activeTaskId = null;
      changed(); closeModal(); render();
    }
    if (action === 'select-task') {
      if (state.activeTaskId === button.dataset.id) {tab='context'; render(); return;}
      state.activeTaskId = button.dataset.id;
      state.tasks.find(t=>t.id===button.dataset.id).status = 'active';
      changed(); render(); toast('Задача выбрана. Обновите контекст перед передачей агенту.');
    }
    if (action === 'close-modal') closeModal();
    if (action === 'discard-close') bridge?.readyToClose();
    if (action === 'copy-brief') {
      const text = OporaContext.taskBrief(state);
      if (bridge) await bridge.copy(text); else await navigator.clipboard.writeText(text);
      toast('Запрос скопирован. Вставьте его в Claude или Codex.');
    }
    if (action === 'preview-sync') await previewSync();
    if (action === 'confirm-sync' && pendingSync) {
      button.disabled = true;
      try {
        const snapshot = pendingSync;
        const result = await bridge.sync(snapshot.state);
        syncedRevision = snapshot.revision;
        closeModal(); render(); toast(`Контекст записан. Резервная копия: ${result.backup}`);
      } finally {button.disabled = false;}
    }
    if (action === 'add-reference') {
      if (!root) {toast('Сначала подключите папку игры в приложении Windows.',true); return;}
      const refs = await bridge.addReferences();
      state.references.push(...refs);
      if (refs.length) {changed(); render();}
    }
    if (action === 'remove-reference') {
      state.references = state.references.filter(r=>r.id !== button.dataset.id);
      changed(); render(); toast('Образец убран из контекста. Файл оставлен в папке проекта.');
    }
    if (action === 'help') showModal('<h2 id="modal-title">Общая память вашей игры</h2><ol class="help-list"><li>Подключите корень игры Godot. Opora добавит свою папку .opora; код и сцены не меняются.</li><li>Опишите игру и постоянные замечания. Добавьте брендбук и изображения, когда будете готовы. Неутверждённое остаётся черновиком.</li><li>Для прямого подключения откройте «Агенты · MCP», настройте клиент и перезапустите его сессию. Он сможет читать последние сохранённые данные без копирования.</li><li>При работе через файлы выберите задачу с критериями готовности. В разделе «Контекст для ИИ» посмотрите и обновите файлы проекта.</li><li>Скопируйте запрос в Claude Code или Codex, работающий из корня этой игры. В существующем чате тоже попросите перечитать памятку.</li><li>Проверьте результат в Godot. Новое замечание внесите в Opora и снова обновите контекст. Агент не получает обновления автоматически.</li></ol><p>Opora работает без API, не запускает агентов и не проверяет изображения на соответствие стилю. У каждого проекта своя память. Используйте существующую папку игры: отдельный Git worktree для этого не нужен.</p><div class="modal-actions"><button class="button" data-action="close-modal">Понятно</button></div>');
  } catch(error) {fail(error);}
});
window.addEventListener('beforeunload', () => {if (!root) persist();});
$('#modal').addEventListener('cancel', event => {
  if(updatesOpen && updateState?.status==='installing'){event.preventDefault();return;}
  pendingSync = null;pendingBrand=null;pendingAgent=null;updatesOpen=false;
});
async function initialize() {
  if (!bridge?.restoreProject) return;
  try {
    const project = await bridge.restoreProject();
    if (project?.error) {toast(project.error, true); return;}
    if (!project) return;
    root = project.root;
    state = project.state || blankState(project.info.name);
    render(); status('Проект открыт · локальные данные');
    if(needsBrandbook() && bridge.scanBrandbook)await scanBrand(true);
  } catch(error) {fail(error);}
}
bridge?.onCloseRequested?.(async () => {
  if (closing) return;
  closing = true;
  try {await persist(); await saves; bridge.readyToClose();} catch {
    closing = false;
    showModal('<h2 id="modal-title">Изменения не сохранены</h2><p>Проверьте название игры и доступ к её папке. Можно вернуться к работе или закрыть приложение, потеряв последние несохранённые изменения.</p><div class="modal-actions"><button class="button secondary" data-action="discard-close">Закрыть без сохранения</button><button class="button" data-action="close-modal">Продолжить работу</button></div>');
  }
});
render();
initialize();
</script></body>
</html>
